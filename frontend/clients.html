<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadsPro — Clients</title>
   <script src="config.js"></script>
  <link rel="icon" type="image/png" href="logosrbg.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="sidebar.js"></script>
  <style>
    .modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1;
    }
    .modal-content {
      position: relative;
      z-index: 2;
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <div id="headerContainer"></div>
      <div class="main-scroll">

        <!-- Welcome Bar -->
        <div style="background:linear-gradient(135deg,#ede9fe,#fce7f3);border-radius:16px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
          <div>
            <h1 style="font-size:20px;font-weight:800;color:#1e1b4b;">Manage Your Clients 👥</h1>
            <p style="color:#6B7280;font-size:13px;margin-top:3px;">Keep track of all your clients, documents, and notes in one place.</p>
          </div>
          <button onclick="openAddClientModal()" style="background:#6C3EF4;color:white;border:none;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(108,62,244,0.35);">+ Add Client</button>
        </div>

        <!-- Stat Cards -->
        <div id="statsGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">

          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);transition:box-shadow 0.2s;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#EDE9FE;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" fill="none" stroke="#7C3AED" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Total Clients</span>
            </div>
            <div id="totalClients" style="font-size:32px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#D1FAE5;color:#065F46;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">↑ Growing</span></div>
          </div>

          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);transition:box-shadow 0.2s;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#FEF3C7;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" fill="none" stroke="#D97706" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2-13H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Documents</span>
            </div>
            <div id="totalDocuments" style="font-size:32px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">📄 Files</span></div>
          </div>

          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);transition:box-shadow 0.2s;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#DBEAFE;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" fill="none" stroke="#2563EB" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Notes</span>
            </div>
            <div id="totalNotes" style="font-size:32px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#DBEAFE;color:#1E40AF;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">💬 Activity</span></div>
          </div>

        </div>

        <!-- Search and Filter -->
        <div style="background:white;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,0.06);margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;">
          <input type="text" id="searchInput" placeholder="Search by name, email, phone, company..." style="flex:1;min-width:200px;padding:10px 14px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;font-family:inherit;outline:none;" onkeyup="loadClients()">
          <input type="text" id="companyFilter" placeholder="Filter by company..." style="width:180px;padding:10px 14px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;font-family:inherit;outline:none;" onchange="loadClients()">
        </div>

        <!-- Clients Table -->
        <div style="background:white;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);overflow:hidden;">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #F3F4F6;">
            <h2 style="font-weight:700;color:#111827;font-size:15px;">👥 All Clients</h2>
            <span id="clientCount" style="font-size:12px;color:#6B7280;font-weight:600;">0 clients</span>
          </div>
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;min-width:600px;">
              <thead style="background:#F9FAFB;">
                <tr>
                  <th style="text-align:left;padding:10px 16px;font-size:11px;color:#6B7280;font-weight:600;">NAME</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;" class="hide-mobile">EMAIL</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;" class="hide-mobile">COMPANY</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;">DOCS</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;">NOTES</th>
                  <th style="text-align:center;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;">ACTIONS</th>
                </tr>
              </thead>
              <tbody id="clientsTableBody">
                <tr><td colspan="6" style="text-align:center;padding:30px;color:#9CA3AF;">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="pagination" style="padding:14px 16px;border-top:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center;"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Add/Edit Client Modal -->
  <div id="clientModal" class="modal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
      <div style="padding:20px;border-bottom:1px solid #F3F4F6;">
        <h2 id="modalTitle" style="font-weight:700;color:#111827;font-size:16px;">Add New Client</h2>
      </div>
      <form id="clientForm" onsubmit="submitClientForm(event)" style="padding:20px;display:flex;flex-direction:column;gap:14px;">
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Client Name *</label>
          <input type="text" id="clientName" required class="inp">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Email</label>
            <input type="email" id="clientEmail" class="inp">
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Phone</label>
            <input type="tel" id="clientPhone" class="inp">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Company</label>
            <input type="text" id="clientCompany" class="inp">
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Address</label>
            <input type="text" id="clientAddress" class="inp">
          </div>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Notes</label>
          <textarea id="clientNotes" class="inp" style="resize:vertical;min-height:80px;"></textarea>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;">
          <button type="button" onclick="closeModal()" style="background:#F3F4F6;color:#374151;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Cancel</button>
          <button type="submit" style="background:#6C3EF4;color:white;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Save Client</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Client Modal -->
  <div id="viewModal" class="modal">
    <div class="modal-overlay" onclick="closeViewModal()"></div>
    <div class="modal-content" style="max-width:600px;max-height:85vh;">
      <div style="padding:20px;border-bottom:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:10;">
        <h2 id="viewTitle" style="font-weight:700;color:#111827;font-size:16px;">Client Details</h2>
        <button onclick="closeViewModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6B7280;line-height:1;">&times;</button>
      </div>
      <div id="viewContent" style="padding:20px;"></div>
    </div>
  </div>

  <div style="position:fixed;bottom:20px;right:30px;z-index:60;color:#7c3aed;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;">
    Powered By <a href="https://vipprow.com/" target="_blank" rel="noopener noreferrer"   className="hover:text-purple-300 transition-colors duration-300" ><b>VIPPROW</b></a>
  </div>

  <script>
    injectCommonStyles();
    renderSidebar('Clients');
    document.getElementById('headerContainer').innerHTML = renderHeader('Clients',
      `<button onclick="openAddClientModal()" style="background:#6C3EF4;color:white;border:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,62,244,0.3);">+ Add Client</button>`
    );

    const token = localStorage.getItem('token');
    const user  = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'login.html';

    

    const avColors = ['#6C3EF4','#EC4899','#0EA5E9','#10B981','#F59E0B','#EF4444'];
    function getInitials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
    function getColor(n){return avColors[(n||'A').charCodeAt(0)%avColors.length];}
    let currentClientId = null;

    // ── Modal Functions ──
    function openAddClientModal(){
      currentClientId = null;
      document.getElementById('modalTitle').textContent = 'Add New Client';
      document.getElementById('clientForm').reset();
      document.getElementById('clientModal').style.display = 'flex';
    }

    function closeModal(){
      document.getElementById('clientModal').style.display = 'none';
      currentClientId = null;
    }

    function closeViewModal(){
      document.getElementById('viewModal').style.display = 'none';
    }

    // ── Submit Client Form ──
    async function submitClientForm(e){
      e.preventDefault();
      const data = {
        name: document.getElementById('clientName').value,
        email: document.getElementById('clientEmail').value,
        phone: document.getElementById('clientPhone').value,
        company: document.getElementById('clientCompany').value,
        address: document.getElementById('clientAddress').value,
        notes: document.getElementById('clientNotes').value
      };

      try{
        const method = currentClientId ? 'PUT' : 'POST';
        const url = `${API}/api/clients${currentClientId ? '/' + currentClientId : ''}`;
        const res = await fetch(url, {
          method,
          headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if(result.success){
          showToast(currentClientId ? '✅ Client updated!' : '✅ Client added!', 'ok');
          closeModal();
          loadClients();
          loadStats();
        } else {
          showToast('❌ ' + (result.message || 'Error'), 'err');
        }
      } catch(e){
        showToast('❌ Server error: ' + e.message, 'err');
      }
    }

    // ── Load Stats ──
    async function loadStats(){
      try{
        const res = await fetch(`${API}/api/clients/stats`, { headers: {'Authorization': `Bearer ${token}`} });
        const data = await res.json();
        if(data.success && data.stats){
          document.getElementById('totalClients').textContent = data.stats.total || 0;
          document.getElementById('totalDocuments').textContent = data.stats.documents || 0;
          document.getElementById('totalNotes').textContent = data.stats.notes || 0;
        }
      } catch(e){ console.error('Stats error:', e); }
    }

    // ── Load Clients ──
    async function loadClients(page = 1){
      try{
        const search = document.getElementById('searchInput').value;
        const company = document.getElementById('companyFilter').value;
        let url = `${API}/api/clients?page=${page}&limit=10`;
        if(search) url += `&search=${encodeURIComponent(search)}`;
        if(company) url += `&company=${encodeURIComponent(company)}`;

        const res = await fetch(url, { headers: {'Authorization': `Bearer ${token}`} });
        const data = await res.json();
        const tbody = document.getElementById('clientsTableBody');

        if(data.success && data.data.length > 0){
          tbody.innerHTML = data.data.map(c => `
            <tr style="border-bottom:1px solid #F9FAFB;cursor:pointer;" onclick="viewClient(${c.id})">
              <td style="padding:10px 16px;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <div class="avatar" style="background:${getColor(c.name)}">${getInitials(c.name)}</div>
                  <span style="font-size:13px;font-weight:600;color:#1F2937;">${c.name}</span>
                </div>
              </td>
              <td style="padding:10px 12px;font-size:13px;color:#6B7280;" class="hide-mobile">${c.email || '—'}</td>
              <td style="padding:10px 12px;font-size:13px;color:#6B7280;" class="hide-mobile">${c.company || '—'}</td>
              <td style="padding:10px 12px;"><span class="badge" style="background:#EDE9FE;color:#7C3AED;">${c.doc_count || 0} files</span></td>
              <td style="padding:10px 12px;"><span class="badge" style="background:#DBEAFE;color:#2563EB;">${c.notes_count || 0} notes</span></td>
              <td style="padding:10px 12px;text-align:center;">
                <button onclick="event.stopPropagation();editClient(${c.id})" style="background:none;border:none;color:#6C3EF4;cursor:pointer;font-weight:600;font-size:12px;">Edit</button>
                <button onclick="event.stopPropagation();deleteClient(${c.id})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-weight:600;font-size:12px;margin-left:8px;">Delete</button>
              </td>
            </tr>
          `).join('');

          const totalPages = data.pagination?.pages || 1;
          const total = data.pagination?.total || 0;
          document.getElementById('clientCount').textContent = `${total} clients`;

          let paginationHTML = '';
          if(totalPages > 1){
            if(page > 1) paginationHTML += `<button onclick="loadClients(${page-1})" style="background:#F3F4F6;border:1px solid #E5E7EB;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">← Prev</button>`;
            paginationHTML += `<span style="font-size:12px;color:#6B7280;">Page ${page} of ${totalPages}</span>`;
            if(page < totalPages) paginationHTML += `<button onclick="loadClients(${page+1})" style="background:#F3F4F6;border:1px solid #E5E7EB;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">Next →</button>`;
          }
          document.getElementById('pagination').innerHTML = paginationHTML;
        } else {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:#9CA3AF;">No clients found</td></tr>';
          document.getElementById('pagination').innerHTML = '';
        }
      } catch(e){
        document.getElementById('clientsTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:#EF4444;">Error loading clients</td></tr>';
      }
    }

    // ── View Client ──
    async function viewClient(id){
      try{
        const res = await fetch(`${API}/api/clients/${id}`, { headers: {'Authorization': `Bearer ${token}`} });
        const data = await res.json();
        if(data.success && data.data){
          const c = data.data;
          let content = `
            <div style="margin-bottom:20px;">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                <div class="avatar" style="background:${getColor(c.name)};width:50px;height:50px;font-size:18px;">${getInitials(c.name)}</div>
                <div>
                  <h3 style="font-size:16px;font-weight:700;color:#111827;margin:0;">${c.name}</h3>
                  <p style="font-size:12px;color:#6B7280;margin:3px 0;">${c.company || 'No company'}</p>
                </div>
              </div>
              <div style="background:#F9FAFB;border-radius:8px;padding:12px;margin-bottom:16px;">
                <p style="font-size:12px;color:#6B7280;margin:0 0 6px 0;">📧 ${c.email || 'N/A'}</p>
                <p style="font-size:12px;color:#6B7280;margin:0 0 6px 0;">📱 ${c.phone || 'N/A'}</p>
                <p style="font-size:12px;color:#6B7280;margin:0;">${c.address ? '📍 ' + c.address : ''}</p>
              </div>
              ${c.notes ? `<p style="font-size:12px;color:#374151;background:#FEF3C7;border-radius:8px;padding:12px;margin-bottom:16px;">${c.notes}</p>` : ''}
            </div>

            <div style="border-top:1px solid #E5E7EB;padding-top:16px;">
              <h4 style="font-size:13px;font-weight:700;color:#111827;margin-bottom:12px;">📄 Documents (${c.documents?.length || 0})</h4>
              ${c.documents && c.documents.length > 0 ? `
                <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
                  ${c.documents.map(d => `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#F9FAFB;border-radius:6px;">
                      <a href="${API}${d.file_path}" target="_blank" style="flex:1;color:#6C3EF4;text-decoration:none;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;">${d.doc_name}</a>
                      <button onclick="deleteDoc(${d.id})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:12px;">🗑️</button>
                    </div>
                  `).join('')}
                </div>
              ` : '<p style="font-size:12px;color:#9CA3AF;">No documents</p>'}
              <input type="file" id="docInput" style="display:none;" onchange="uploadDoc(${id})">
              <button onclick="document.getElementById('docInput').click()" style="width:100%;background:#F3F4F6;border:1px dashed #D1D5DB;padding:8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;color:#374151;">+ Upload Document</button>
            </div>

            <div style="border-top:1px solid #E5E7EB;padding-top:16px;margin-top:16px;">
              <h4 style="font-size:13px;font-weight:700;color:#111827;margin-bottom:12px;">💬 Notes (${c.notes_count || 0})</h4>
              <div id="notesList" style="max-height:200px;overflow-y:auto;margin-bottom:12px;"></div>
              <div style="display:flex;gap:8px;">
                <input type="text" id="newNote" placeholder="Add a note..." style="flex:1;padding:8px 12px;border:1px solid #E5E7EB;border-radius:6px;font-size:12px;">
                <button onclick="addNote(${id})" style="background:#6C3EF4;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;">Add</button>
              </div>
            </div>

            <div style="border-top:1px solid #E5E7EB;padding-top:16px;margin-top:16px;display:flex;gap:10px;">
              <button onclick="editClientModal(${id})" style="flex:1;background:#6C3EF4;color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;font-weight:600;">Edit Client</button>
              <button onclick="deleteClient(${id})" style="flex:1;background:#FEE2E2;color:#DC2626;border:none;padding:10px;border-radius:8px;cursor:pointer;font-weight:600;">Delete Client</button>
            </div>
          `;
          document.getElementById('viewContent').innerHTML = content;
          loadNotes(id);
          document.getElementById('viewModal').style.display = 'flex';
          currentClientId = id;
        }
      } catch(e){
        showToast('❌ Error loading client', 'err');
      }
    }

    // ── Load Notes ──
    async function loadNotes(clientId){
      try{
        const res = await fetch(`${API}/api/clients/notes/${clientId}`, { headers: {'Authorization': `Bearer ${token}`} });
        const data = await res.json();
        const notesList = document.getElementById('notesList');
        if(data.success && data.data.length > 0){
          notesList.innerHTML = data.data.map(n => `
            <div style="padding:10px;background:#F9FAFB;border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:start;">
              <div style="flex:1;">
                <p style="font-size:12px;color:#111827;margin:0 0 3px 0;">${n.note}</p>
                <p style="font-size:10px;color:#9CA3AF;margin:0;">${n.created_by_name || 'You'}</p>
              </div>
              <button onclick="deleteNote(${n.id})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:12px;">🗑️</button>
            </div>
          `).join('');
        } else {
          notesList.innerHTML = '<p style="font-size:12px;color:#9CA3AF;">No notes yet</p>';
        }
      } catch(e){ console.error('Error loading notes:', e); }
    }

    // ── Add Note ──
    async function addNote(clientId){
      const noteText = document.getElementById('newNote').value;
      if(!noteText.trim()) return;

      try{
        const res = await fetch(`${API}/api/clients/notes`, {
          method: 'POST',
          headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
          body: JSON.stringify({client_id: clientId, note: noteText})
        });
        const data = await res.json();
        if(data.success){
          document.getElementById('newNote').value = '';
          loadNotes(clientId);
          loadStats();
          showToast('✅ Note added!', 'ok');
        }
      } catch(e){
        showToast('❌ Error adding note', 'err');
      }
    }

    // ── Delete Note ──
    async function deleteNote(noteId){
      if(confirm('Delete this note?')){
        try{
          const res = await fetch(`${API}/api/clients/notes/${noteId}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
          const data = await res.json();
          if(data.success){
            loadNotes(currentClientId);
            loadStats();
            showToast('✅ Note deleted!', 'ok');
          }
        } catch(e){ showToast('❌ Error deleting note', 'err'); }
      }
    }

    // ── Upload Document ──
    async function uploadDoc(clientId){
      const input = document.getElementById('docInput');
      if(!input.files[0]) return;

      const formData = new FormData();
      formData.append('document', input.files[0]);
      formData.append('client_id', clientId);

      try{
        const res = await fetch(`${API}/api/clients/upload-document`, {
          method: 'POST',
          headers: {'Authorization': `Bearer ${token}`},
          body: formData
        });
        const data = await res.json();
        if(data.success){
          input.value = '';
          viewClient(clientId);
          loadStats();
          showToast('✅ Document uploaded!', 'ok');
        } else {
          showToast('❌ ' + (data.message || 'Upload failed'), 'err');
        }
      } catch(e){
        showToast('❌ Error uploading document', 'err');
      }
    }

    // ── Delete Document ──
    async function deleteDoc(docId){
      if(confirm('Delete this document?')){
        try{
          const res = await fetch(`${API}/api/clients/documents/${docId}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
          const data = await res.json();
          if(data.success){
            viewClient(currentClientId);
            loadStats();
            showToast('✅ Document deleted!', 'ok');
          }
        } catch(e){ showToast('❌ Error deleting document', 'err'); }
      }
    }

    // ── Edit Client ──
    async function editClientModal(id){
      try{
        const res = await fetch(`${API}/api/clients/${id}`, { headers: {'Authorization': `Bearer ${token}`} });
        const data = await res.json();
        if(data.success){
          const c = data.data;
          currentClientId = id;
          document.getElementById('modalTitle').textContent = 'Edit Client';
          document.getElementById('clientName').value = c.name;
          document.getElementById('clientEmail').value = c.email || '';
          document.getElementById('clientPhone').value = c.phone || '';
          document.getElementById('clientCompany').value = c.company || '';
          document.getElementById('clientAddress').value = c.address || '';
          document.getElementById('clientNotes').value = c.notes || '';
          closeViewModal();
          document.getElementById('clientModal').style.display = 'flex';
        }
      } catch(e){ showToast('❌ Error loading client', 'err'); }
    }

    async function editClient(id){ editClientModal(id); }

    // ── Delete Client ──
    async function deleteClient(id){
      if(confirm('Are you sure? This will delete all associated documents and notes.')){
        try{
          const res = await fetch(`${API}/api/clients/${id}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
          const data = await res.json();
          if(data.success){
            closeViewModal();
            loadClients();
            loadStats();
            showToast('✅ Client deleted!', 'ok');
          }
        } catch(e){ showToast('❌ Error deleting client', 'err'); }
      }
    }

    // ── Responsive Grid ──
    function fixGrid(){
      const g = document.getElementById('statsGrid');
      if(window.innerWidth < 640) g.style.gridTemplateColumns = '1fr';
      else if(window.innerWidth < 1024) g.style.gridTemplateColumns = 'repeat(2,1fr)';
      else g.style.gridTemplateColumns = 'repeat(3,1fr)';
    }
    fixGrid();
    window.addEventListener('resize', fixGrid);

    // ── Init ──
    loadStats();
    loadClients();
  </script>
</body>
</html>
