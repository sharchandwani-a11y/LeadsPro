<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadsPro — Tasks</title>
   <script src="config.js"></script>
  <link rel="icon" type="image/png" href="logosrbg.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 
  <script src="sidebar.js"></script>
  <style>
    .task-card{background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);margin-bottom:12px;border-left:4px solid #E5E7EB;transition:box-shadow 0.2s;}
    .task-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1);}
    .task-card.priority-High{border-left-color:#EF4444;}
    .task-card.priority-Medium{border-left-color:#F59E0B;}
    .task-card.priority-Low{border-left-color:#10B981;}
    .task-card.done-card{opacity:0.55;}
    .filter-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid #E5E7EB;background:white;color:#6B7280;transition:all 0.2s;white-space:nowrap;}
    .filter-btn.active{background:#6C3EF4;border-color:#6C3EF4;color:white;}
    .tab-btn{padding:9px 18px;border:none;background:transparent;font-size:13px;font-weight:700;color:#9CA3AF;cursor:pointer;border-bottom:2.5px solid transparent;transition:all 0.2s;white-space:nowrap;}
    .tab-btn.active{color:#6C3EF4;border-bottom-color:#6C3EF4;}
    .stat-mini{background:white;border-radius:14px;padding:16px 20px;box-shadow:0 1px 6px rgba(0,0,0,0.06);display:flex;align-items:center;gap:14px;}
    .modal-box{background:white;border-radius:20px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
    .modal-box label{font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;margin-top:12px;}
    .modal-box select,.modal-box textarea{width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;background:white;font-family:'Plus Jakarta Sans',sans-serif;}
    .modal-box select:focus,.modal-box textarea:focus{border-color:#6C3EF4;}
    .modal-box textarea{resize:vertical;min-height:80px;}
    .done-btn{background:#D1FAE5;color:#065F46;border:1.5px solid #A7F3D0;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;}
    .done-btn:hover{background:#A7F3D0;}
    .done-btn.completed{background:#F3F4F6;color:#9CA3AF;border-color:#E5E7EB;cursor:default;}
    .delete-btn{background:#FEE2E2;color:#991B1B;border:1.5px solid #FECACA;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
    .priority-badge-High{background:#FEE2E2;color:#991B1B;}
    .priority-badge-Medium{background:#FEF3C7;color:#92400E;}
    .priority-badge-Low{background:#D1FAE5;color:#065F46;}
    .recur-badge-Once{background:#F3F4F6;color:#6B7280;}
    .recur-badge-Daily{background:#DBEAFE;color:#1E40AF;}
    .recur-badge-Weekly{background:#EDE9FE;color:#6C3EF4;}
    .recur-badge-Monthly{background:#FCE7F3;color:#BE185D;}
    .empty-state{text-align:center;padding:60px 20px;color:#9CA3AF;}
    .chart-panel{background:white;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);overflow:hidden;}
    .chart-panel-header{padding:14px 16px;border-bottom:1px solid #F3F4F6;font-size:15px;font-weight:700;color:#111827;}
    .legend-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #F9FAFB;}
    .legend-row:last-child{border-bottom:none;}
    .progress-bar-wrap{background:#F3F4F6;border-radius:20px;height:6px;flex:1;margin:0 10px;overflow:hidden;}
    .progress-bar-fill{height:6px;border-radius:20px;transition:width 0.5s;}
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Add Task Modal -->
  <div class="modal-bg" id="addModal" style="display:none;">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h2 style="font-size:18px;font-weight:800;color:#111827;">✅ Create New Task</h2>
        <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9CA3AF;">✕</button>
      </div>

      <label>Task Title *</label>
      <input type="text" id="t_title" class="inp" placeholder="e.g. Call Rahul about demo today"/>

      <label>Description</label>
      <textarea id="t_desc" placeholder="Add task details..."></textarea>

      <label>Assign To *</label>
      <select id="t_user"><option value="">Select User</option></select>

      <label>Related Lead</label>
      <select id="t_lead"><option value="">None</option></select>

      <label>Repeat *</label>
      <select id="t_recurrence" onchange="onRecurrenceChange()">
        <option value="Once">📌 One-time (single task)</option>
        <option value="Daily">🔁 Daily (repeats every day)</option>
        <option value="Weekly">🔁 Weekly (repeats every week)</option>
        <option value="Monthly">🔁 Monthly (repeats every month)</option>
      </select>
      <p id="recurHint" style="font-size:11px;color:#9CA3AF;margin-top:4px;"></p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label>Priority</label>
          <select id="t_priority">
            <option value="High">🔴 High</option>
            <option value="Medium" selected>🟡 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>
        </div>
        <div>
          <label id="dueLabel">Due Date *</label>
          <input type="date" id="t_due" class="inp" style="margin-top:0;"/>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:20px;">
        <button onclick="closeModal()" style="flex:1;background:#F3F4F6;color:#374151;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
        <button onclick="saveTask()" style="flex:2;background:#6C3EF4;color:white;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,62,244,0.3);">✅ Create Task</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <div id="headerContainer"></div>
      <div class="main-scroll">

        <!-- Welcome Bar -->
<div style="background:linear-gradient(135deg,#ede9fe,#fce7f3);border-radius:16px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
  <div>
    <h1 style="font-size:20px;font-weight:800;color:#1e1b4b;">Task Manager ✅</h1>
    <p style="color:#6B7280;font-size:13px;margin-top:3px;" id="taskSubtitle">Assign and track tasks for your team</p>
  </div>
  <button id="addTaskBtn" onclick="openModal()" style="display:none;background:#6C3EF4;color:white;border:none;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(108,62,244,0.35);">+ New Task</button>
</div>

        <!-- Stat Cards -->
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;" id="statsRow">
          <div class="stat-mini">
            <div style="width:40px;height:40px;border-radius:12px;background:#EDE9FE;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="18" height="18" fill="none" stroke="#7C3AED" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            </div>
            <div>
              <div style="font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;">Total</div>
              <div style="font-size:26px;font-weight:800;color:#111827;" id="stat-total">0</div>
            </div>
          </div>
          <div class="stat-mini">
            <div style="width:40px;height:40px;border-radius:12px;background:#FEF3C7;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="18" height="18" fill="none" stroke="#D97706" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div>
              <div style="font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;">Pending</div>
              <div style="font-size:26px;font-weight:800;color:#111827;" id="stat-pending">0</div>
            </div>
          </div>
          <div class="stat-mini">
            <div style="width:40px;height:40px;border-radius:12px;background:#D1FAE5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="18" height="18" fill="none" stroke="#059669" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div>
              <div style="font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;">Completed</div>
              <div style="font-size:26px;font-weight:800;color:#111827;" id="stat-done">0</div>
            </div>
          </div>
          <div class="stat-mini">
            <div style="width:40px;height:40px;border-radius:12px;background:#FEE2E2;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="18" height="18" fill="none" stroke="#EF4444" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <div>
              <div style="font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;">Overdue</div>
              <div style="font-size:26px;font-weight:800;color:#EF4444;" id="stat-overdue">0</div>
            </div>
          </div>
        </div>

        <!-- Charts Row -->
        <div style="display:grid;grid-template-columns:260px 1fr;gap:14px;margin-bottom:20px;" id="chartGrid">
          <div class="chart-panel">
            <div class="chart-panel-header">📊 Task Status</div>
            <div style="padding:20px;height:180px;position:relative;">
              <canvas id="statusChart"></canvas>
            </div>
            <div style="padding:4px 16px 16px;">
              <div class="legend-row">
                <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:#6C3EF4;"></div><span style="font-size:12px;color:#6B7280;">Pending</span></div>
                <span style="font-size:12px;font-weight:700;color:#111827;" id="leg-pending">0</span>
              </div>
              <div class="legend-row">
                <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:#10B981;"></div><span style="font-size:12px;color:#6B7280;">Completed</span></div>
                <span style="font-size:12px;font-weight:700;color:#111827;" id="leg-completed">0</span>
              </div>
              <div class="legend-row">
                <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:#EF4444;"></div><span style="font-size:12px;color:#6B7280;">Overdue</span></div>
                <span style="font-size:12px;font-weight:700;color:#111827;" id="leg-overdue">0</span>
              </div>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="chart-panel">
              <div class="chart-panel-header">🎯 Priority</div>
              <div style="padding:16px;">
                <div style="margin-bottom:14px;">
                  <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                    <span style="font-size:12px;color:#6B7280;font-weight:600;">🔴 High</span>
                    <span style="font-size:12px;font-weight:700;color:#111827;" id="pri-high-count">0</span>
                  </div>
                  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pri-high-bar" style="background:#EF4444;width:0%;"></div></div>
                </div>
                <div style="margin-bottom:14px;">
                  <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                    <span style="font-size:12px;color:#6B7280;font-weight:600;">🟡 Medium</span>
                    <span style="font-size:12px;font-weight:700;color:#111827;" id="pri-med-count">0</span>
                  </div>
                  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pri-med-bar" style="background:#F59E0B;width:0%;"></div></div>
                </div>
                <div>
                  <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                    <span style="font-size:12px;color:#6B7280;font-weight:600;">🟢 Low</span>
                    <span style="font-size:12px;font-weight:700;color:#111827;" id="pri-low-count">0</span>
                  </div>
                  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pri-low-bar" style="background:#10B981;width:0%;"></div></div>
                </div>
              </div>
            </div>

            <div class="chart-panel">
              <div class="chart-panel-header">👥 User Performance</div>
              <div style="padding:16px;overflow-y:auto;max-height:180px;" id="userPerf">
                <div style="text-align:center;color:#9CA3AF;font-size:13px;padding:20px 0;">No tasks yet</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Recurrence Tabs -->
        <div style="display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;background:white;border-radius:12px;padding:4px;box-shadow:0 1px 6px rgba(0,0,0,0.06);">
          <button class="tab-btn active" onclick="setRecurTab('All',this)">All</button>
          <button class="tab-btn" onclick="setRecurTab('Daily',this)">📅 Daily</button>
          <button class="tab-btn" onclick="setRecurTab('Weekly',this)">🗓️ Weekly</button>
          <button class="tab-btn" onclick="setRecurTab('Monthly',this)">📆 Monthly</button>
          <button class="tab-btn" onclick="setRecurTab('Once',this)">📌 One-time</button>
        </div>

        <!-- Filter Bar -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;overflow-x:auto;">
          <button class="filter-btn active" onclick="filterTasks('All',this)">All Status</button>
          <button class="filter-btn" onclick="filterTasks('Pending',this)">⏳ Pending</button>
          <button class="filter-btn" onclick="filterTasks('Completed',this)">✅ Completed</button>
          <button class="filter-btn" onclick="filterTasks('High',this)">🔴 High Priority</button>
          <button class="filter-btn" onclick="filterTasks('Overdue',this)">⚠️ Overdue</button>
        </div>

        <!-- Task List -->
        <div id="taskList"></div>

      </div>
    </div>
  </div>

  <div style="position:fixed;bottom:20px;right:30px;z-index:9999;color:#7c3aed;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;">
    Powered By <a href="https://vipprow.com/" target="_blank" rel="noopener noreferrer"><b>VIPPROW</b></a>
  </div>

  <script>
    injectCommonStyles();
    renderSidebar('Tasks');

    const token   = localStorage.getItem('token');
    const user    = JSON.parse(localStorage.getItem('user') || '{}');
    const isAdmin = user.role === 'admin';
    

    if (!token) window.location.href = 'login.html';

    document.getElementById('headerContainer').innerHTML = renderHeader('Tasks',
      isAdmin ? `<button onclick="openModal()" style="background:#6C3EF4;color:white;border:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;">+ New Task</button>` : ''
    );

    if (isAdmin) document.getElementById('addTaskBtn').style.display = 'block';
    if (!isAdmin) document.getElementById('taskSubtitle').textContent = 'Tasks assigned to you by admin';

    const avColors = ['#6C3EF4','#EC4899','#0EA5E9','#10B981','#F59E0B','#EF4444'];
    function getInitials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
    function getColor(n){return avColors[(n||'A').charCodeAt(0)%avColors.length];}

    let allTasks=[], allUsers=[], allLeads=[];
    let currentFilter='All', currentRecurTab='All';
    let statusChartInstance=null;

    // ── Load Dropdowns ──
    async function loadDropdowns(){
      try{
        const ru=await fetch(`${API}/api/auth/users`,{headers:{'Authorization':`Bearer ${token}`}});
        const du=await ru.json();
        if(du.success && du.data){
          allUsers=du.data;
          const sel=document.getElementById('t_user');
          sel.innerHTML='<option value="">Select User</option>';
          du.data.forEach(u=>{
            const o=document.createElement('option');
            o.value=u.id;
            o.textContent=`${u.name} (${u.role||'user'})`;
            sel.appendChild(o);
          });
        }
      }catch(e){ console.error('Users load error:',e); }
      try{
        const rl=await fetch(`${API}/api/leads?limit=100`,{headers:{'Authorization':`Bearer ${token}`}});
        const dl=await rl.json();
        if(dl.success && dl.data){
          allLeads=dl.data;
          const sel=document.getElementById('t_lead');
          sel.innerHTML='<option value="">None</option>';
          dl.data.forEach(l=>{
            const o=document.createElement('option');
            o.value=l.id;
            o.textContent=`${l.name} — ${l.phone||''}`;
            sel.appendChild(o);
          });
        }
      }catch(e){ console.error('Leads load error:',e); }
    }

    // ── Modal ──
    function openModal(){
      document.getElementById('t_title').value='';
      document.getElementById('t_desc').value='';
      document.getElementById('t_user').value='';
      document.getElementById('t_lead').value='';
      document.getElementById('t_priority').value='Medium';
      document.getElementById('t_recurrence').value='Once';
      document.getElementById('t_due').value='';
      onRecurrenceChange();
      document.getElementById('addModal').style.display='flex';
    }
    function closeModal(){ document.getElementById('addModal').style.display='none'; }
    document.getElementById('addModal').addEventListener('click',function(e){if(e.target===this)closeModal();});

    function onRecurrenceChange(){
      const r=document.getElementById('t_recurrence').value;
      const hint=document.getElementById('recurHint');
      const dueInput=document.getElementById('t_due');
      const dueLabel=document.getElementById('dueLabel');
      if(r==='Once'){
        hint.textContent='This task will be created exactly once.';
        dueLabel.textContent='Due Date *';
        dueInput.style.display='block';
      } else if(r==='Daily'){
        hint.textContent='🔁 Naya pending task roz automatically aayega.';
        dueLabel.textContent='Due Date (auto-set)';
        dueInput.style.display='none';
      } else if(r==='Weekly'){
        hint.textContent='🔁 Naya pending task har hafte aayega (due Saturday).';
        dueLabel.textContent='Due Date (auto-set)';
        dueInput.style.display='none';
      } else if(r==='Monthly'){
        hint.textContent='🔁 Naya pending task har mahine aayega (due last day).';
        dueLabel.textContent='Due Date (auto-set)';
        dueInput.style.display='none';
      }
    }

    // ── Save Task ──
    async function saveTask(){
      const title       = document.getElementById('t_title').value.trim();
      const description = document.getElementById('t_desc').value.trim();
      const userId      = document.getElementById('t_user').value;
      const leadId      = document.getElementById('t_lead').value;
      const priority    = document.getElementById('t_priority').value;
      const recurrence  = document.getElementById('t_recurrence').value;
      const due_date    = document.getElementById('t_due').value;

      if(!title){ showToast('⚠️ Task title required!','err'); return; }
      if(!userId){ showToast('⚠️ Please assign to a user!','err'); return; }
      if(recurrence==='Once' && !due_date){ showToast('⚠️ Due date required!','err'); return; }

      const assigned_name = allUsers.find(u=>String(u.id)===String(userId))?.name || '';
      const lead_name     = allLeads.find(l=>String(l.id)===String(leadId))?.name || null;

      try{
        const res=await fetch(`${API}/api/tasks`,{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
          body: JSON.stringify({
            title, description,
            assigned_to: userId,
            assigned_name,
            lead_id: leadId||null,
            lead_name,
            priority,
            recurrence,
            due_date: due_date||null
          })
        });
        const data=await res.json();
        if(data.success){
          showToast(recurrence==='Once'?'✅ Task created!':'✅ Recurring task set up!','ok');
          closeModal();
          loadTasks();
        } else showToast('❌ '+data.message,'err');
      }catch(e){ showToast('❌ Server error','err'); }
    }

    // ── Load Tasks ──
    async function loadTasks(){
      try{
        const res=await fetch(`${API}/api/tasks`,{headers:{'Authorization':`Bearer ${token}`}});
        const data=await res.json();
        if(data.success){
          allTasks=data.data;
          updateDashboard();
          renderTasks();
        }
      }catch(e){ console.error('Tasks load error:',e); }
    }

    // ── Mark Done ──
    async function markDone(id){
      try{
        const res=await fetch(`${API}/api/tasks/${id}/done`,{method:'PUT',headers:{'Authorization':`Bearer ${token}`}});
        const data=await res.json();
        if(data.success){ showToast('✅ Task completed!','ok'); loadTasks(); }
        else showToast('❌ '+data.message,'err');
      }catch(e){ showToast('❌ Server error','err'); }
    }

    // ── Delete Task ──
    async function deleteTask(id){
      const t=allTasks.find(t=>t.id===id);
      if(!t) return;
      const msg=t.template_id?'Recurring task hai — yeh aur future repeats bhi delete karo?':'Delete this task?';
      if(!confirm(msg)) return;
      try{
        const res=await fetch(`${API}/api/tasks/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token}`}});
        const data=await res.json();
        if(data.success){ showToast('🗑️ Task deleted','ok'); loadTasks(); }
        else showToast('❌ '+data.message,'err');
      }catch(e){ showToast('❌ Server error','err'); }
    }

    // ── Filters ──
    function filterTasks(f,btn){
      currentFilter=f;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }
    function setRecurTab(r,btn){
      currentRecurTab=r;
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    // ── Update Dashboard ──
    function updateDashboard(){
      const now=new Date();
      const total    =allTasks.length;
      const pending  =allTasks.filter(t=>t.status==='Pending').length;
      const completed=allTasks.filter(t=>t.status==='Completed').length;
      const overdue  =allTasks.filter(t=>t.status!=='Completed'&&t.due_date&&new Date(t.due_date)<now).length;
      const high     =allTasks.filter(t=>t.priority==='High').length;
      const medium   =allTasks.filter(t=>t.priority==='Medium').length;
      const low      =allTasks.filter(t=>t.priority==='Low').length;

      document.getElementById('stat-total').textContent    = total;
      document.getElementById('stat-pending').textContent  = pending;
      document.getElementById('stat-done').textContent     = completed;
      document.getElementById('stat-overdue').textContent  = overdue;
      document.getElementById('leg-pending').textContent   = pending;
      document.getElementById('leg-completed').textContent = completed;
      document.getElementById('leg-overdue').textContent   = overdue;

      const ctx=document.getElementById('statusChart').getContext('2d');
      if(statusChartInstance) statusChartInstance.destroy();
      statusChartInstance=new Chart(ctx,{
        type:'doughnut',
        data:{
          labels:['Pending','Completed','Overdue'],
          datasets:[{
            data: total===0?[1,1,1]:[pending,completed,overdue],
            backgroundColor:['#6C3EF4','#10B981','#EF4444'],
            borderWidth:3,borderColor:'#ffffff',hoverOffset:6
          }]
        },
        options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false}}}
      });

      const maxP=Math.max(high,medium,low,1);
      document.getElementById('pri-high-count').textContent = high;
      document.getElementById('pri-med-count').textContent  = medium;
      document.getElementById('pri-low-count').textContent  = low;
      document.getElementById('pri-high-bar').style.width   = `${(high/maxP)*100}%`;
      document.getElementById('pri-med-bar').style.width    = `${(medium/maxP)*100}%`;
      document.getElementById('pri-low-bar').style.width    = `${(low/maxP)*100}%`;

      if(isAdmin){
        const userMap={};
        allTasks.forEach(t=>{
          const name=t.assigned_name||'Unknown';
          if(!userMap[name]) userMap[name]={total:0,done:0};
          userMap[name].total++;
          if(t.status==='Completed') userMap[name].done++;
        });
        const perfEl=document.getElementById('userPerf');
        const entries=Object.entries(userMap);
        if(!entries.length){
          perfEl.innerHTML='<div style="text-align:center;color:#9CA3AF;font-size:13px;padding:20px 0;">No tasks yet</div>';
        } else {
          perfEl.innerHTML=entries.map(([name,d])=>{
            const pct=d.total>0?Math.round((d.done/d.total)*100):0;
            return `<div style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <div class="avatar" style="width:22px;height:22px;font-size:8px;border-radius:6px;background:${getColor(name)}">${getInitials(name)}</div>
                  <span style="font-size:12px;font-weight:600;color:#111827;">${name}</span>
                </div>
                <span style="font-size:11px;color:#6B7280;">${d.done}/${d.total} · ${pct}%</span>
              </div>
              <div class="progress-bar-wrap"><div class="progress-bar-fill" style="background:#6C3EF4;width:${pct}%;"></div></div>
            </div>`;
          }).join('');
        }
      }
    }

    // ── Render Tasks ──
    function renderTasks(){
      const now=new Date();
      let visible=[...allTasks];

      if(currentRecurTab!=='All') visible=visible.filter(t=>(t.recurrence||'Once')===currentRecurTab);
      if(currentFilter==='High') visible=visible.filter(t=>t.priority==='High');
      else if(currentFilter==='Pending') visible=visible.filter(t=>t.status==='Pending');
      else if(currentFilter==='Completed') visible=visible.filter(t=>t.status==='Completed');
      else if(currentFilter==='Overdue') visible=visible.filter(t=>t.status!=='Completed'&&t.due_date&&new Date(t.due_date)<now);

      visible.sort((a,b)=>{
        if(a.status!==b.status) return a.status==='Pending'?-1:1;
        return new Date(a.due_date||0)-new Date(b.due_date||0);
      });

      const list=document.getElementById('taskList');
      if(!visible.length){
        list.innerHTML=`<div class="empty-state">
          <svg width="48" height="48" fill="none" stroke="#D1D5DB" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 16px;display:block;">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          <p style="font-size:15px;font-weight:600;color:#374151;">No tasks found</p>
          <p style="font-size:13px;margin-top:6px;">${isAdmin?'Click "+ New Task" to create one':'No tasks assigned to you yet'}</p>
        </div>`;
        return;
      }

      list.innerHTML=visible.map(t=>{
        const isOverdue=t.status!=='Completed'&&t.due_date&&new Date(t.due_date)<now;
        const dueFmt=t.due_date?new Date(t.due_date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'No due date';
        const completedFmt=t.completed_at?new Date(t.completed_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):null;
        const recur=t.recurrence||'Once';
        const recurLabel=recur==='Once'?'📌 One-time':recur==='Daily'?'📅 Daily':recur==='Weekly'?'🗓️ Weekly':'📆 Monthly';

        return `<div class="task-card priority-${t.priority} ${t.status==='Completed'?'done-card':''}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
                <span style="font-size:14px;font-weight:700;${t.status==='Completed'?'text-decoration:line-through;color:#9CA3AF;':'color:#111827;'}">${t.title}</span>
                <span class="badge priority-badge-${t.priority}" style="font-size:10px;padding:2px 8px;border-radius:20px;">${t.priority}</span>
                <span class="badge recur-badge-${recur}" style="font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;">${recurLabel}</span>
                ${t.status==='Completed'?'<span style="background:#D1FAE5;color:#065F46;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;">✅ Completed</span>':''}
                ${isOverdue?'<span style="background:#FEE2E2;color:#991B1B;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;">⚠️ Overdue</span>':''}
              </div>

              ${t.description?`<p style="font-size:12px;color:#6B7280;margin-bottom:8px;line-height:1.5;">${t.description}</p>`:''}

              <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <div class="avatar" style="width:24px;height:24px;font-size:9px;border-radius:6px;background:${getColor(t.assigned_name||'')}">${getInitials(t.assigned_name||'')}</div>
                  <span style="font-size:12px;color:#6B7280;font-weight:500;">${t.assigned_name||'Unassigned'}</span>
                </div>

                ${t.lead_name?`<div style="display:flex;align-items:center;gap:5px;">
                  <svg width="11" height="11" fill="none" stroke="#9CA3AF" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                  <span style="font-size:12px;color:#6B7280;">${t.lead_name}</span>
                </div>`:''}

                <div style="display:flex;align-items:center;gap:5px;margin-left:auto;">
                  <svg width="11" height="11" fill="none" stroke="${isOverdue?'#EF4444':'#9CA3AF'}" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <span style="font-size:12px;color:${isOverdue?'#EF4444':'#9CA3AF'};font-weight:${isOverdue?'600':'400'};">${dueFmt}</span>
                </div>
              </div>

              ${completedFmt?`<div style="margin-top:8px;font-size:11px;color:#059669;font-weight:500;">✅ Completed on ${completedFmt}</div>`:''}
              ${isAdmin?`<div style="margin-top:4px;font-size:11px;color:#9CA3AF;">Created by ${t.created_by_name||'Admin'}</div>`:''}
            </div>

            <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
              ${!isAdmin&&t.status!=='Completed'?`<button class="done-btn" onclick="markDone(${t.id})">✅ Mark Done</button>`:''}
              ${!isAdmin&&t.status==='Completed'?`<button class="done-btn completed" disabled>✅ Done</button>`:''}
              ${isAdmin?`<button class="delete-btn" onclick="deleteTask(${t.id})">🗑️ Delete</button>`:''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // ── Responsive ──
    function fixGrid(){
      const s=document.getElementById('statsRow');
      const c=document.getElementById('chartGrid');
      if(window.innerWidth<640){
        s.style.gridTemplateColumns='1fr 1fr';
        c.style.gridTemplateColumns='1fr';
      } else if(window.innerWidth<1024){
        s.style.gridTemplateColumns='repeat(2,1fr)';
        c.style.gridTemplateColumns='1fr';
      } else {
        s.style.gridTemplateColumns='repeat(4,1fr)';
        c.style.gridTemplateColumns='260px 1fr';
      }
    }
    fixGrid();
    window.addEventListener('resize',fixGrid);

    // ── Init ──
    if(isAdmin) loadDropdowns();
    loadTasks();
  </script>
</body>
</html>
