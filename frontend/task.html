<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadsPro — Tasks</title>
  <link rel="icon" type="image/png" href="logosrbg.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="sidebar.js"></script>
  <style>
    .task-card{background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);margin-bottom:12px;border-left:4px solid #E5E7EB;transition:box-shadow 0.2s;}
    .task-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1);}
    .task-card.priority-High{border-left-color:#EF4444;}
    .task-card.priority-Medium{border-left-color:#F59E0B;}
    .task-card.priority-Low{border-left-color:#10B981;}
    .task-card.done-card{opacity:0.55;}
    .filter-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid #E5E7EB;background:white;color:#6B7280;transition:all 0.2s;}
    .filter-btn.active{background:#6C3EF4;border-color:#6C3EF4;color:white;}
    .stat-mini{background:white;border-radius:14px;padding:16px 20px;box-shadow:0 1px 6px rgba(0,0,0,0.06);display:flex;align-items:center;gap:14px;}
    .modal-box{background:white;border-radius:20px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
    .modal-box label{font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;margin-top:12px;}
    .modal-box select{width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;background:white;font-family:'Plus Jakarta Sans',sans-serif;}
    .modal-box select:focus{border-color:#6C3EF4;}
    .modal-box textarea{width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;resize:vertical;min-height:80px;font-family:'Plus Jakarta Sans',sans-serif;}
    .modal-box textarea:focus{border-color:#6C3EF4;}
    .done-btn{background:#D1FAE5;color:#065F46;border:1.5px solid #A7F3D0;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;}
    .done-btn:hover{background:#A7F3D0;}
    .done-btn.completed{background:#F3F4F6;color:#9CA3AF;border-color:#E5E7EB;cursor:default;}
    .delete-btn{background:#FEE2E2;color:#991B1B;border:1.5px solid #FECACA;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
    .priority-badge-High{background:#FEE2E2;color:#991B1B;}
    .priority-badge-Medium{background:#FEF3C7;color:#92400E;}
    .priority-badge-Low{background:#D1FAE5;color:#065F46;}
    .empty-state{text-align:center;padding:60px 20px;color:#9CA3AF;}
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Add Task Modal (Admin Only) -->
  <div class="modal-bg" id="addModal" style="display:none;">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h2 style="font-size:18px;font-weight:800;color:#111827;">✅ Create New Task</h2>
        <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9CA3AF;">✕</button>
      </div>

      <label>Task Title *</label>
      <input type="text" id="t_title" class="inp" placeholder="e.g. Call Rahul about demo today"/>

      <label>Description</label>
      <textarea id="t_desc" placeholder="Add task details..."></textarea>

      <label>Assign To *</label>
      <select id="t_user">
        <option value="">Select User</option>
      </select>

      <label>Related Lead</label>
      <select id="t_lead">
        <option value="">None</option>
      </select>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label>Priority</label>
          <select id="t_priority">
            <option value="High">🔴 High</option>
            <option value="Medium" selected>🟡 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>
        </div>
        <div>
          <label>Due Date *</label>
          <input type="date" id="t_due" class="inp" style="margin-top:0;"/>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:20px;">
        <button onclick="closeModal()" style="flex:1;background:#F3F4F6;color:#374151;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
        <button onclick="saveTask()" style="flex:2;background:#6C3EF4;color:white;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,62,244,0.3);">✅ Create Task</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <div id="headerContainer"></div>
      <div class="main-scroll">

        <!-- Top Bar -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
          <div>
            <h1 style="font-size:20px;font-weight:800;color:#111827;">📋 Task Manager</h1>
            <p style="color:#6B7280;font-size:13px;margin-top:3px;" id="taskSubtitle">Assign and track tasks for your team</p>
          </div>
          <button id="addTaskBtn" onclick="openModal()" style="display:none;background:#6C3EF4;color:white;border:none;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,62,244,0.3);">+ New Task</button>
        </div>

        <!-- Stat Cards -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;" id="statsRow">
          <div class="stat-mini">
            <div style="width:40px;height:40px;border-radius:12px;background:#EDE9FE;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="18" height="18" fill="none" stroke="#7C3AED" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            </div>
            <div>
              <div style="font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;">Total Tasks</div>
              <div style="font-size:26px;font-weight:800;color:#111827;" id="stat-total">0</div>
            </div>
          </div>
          <div class="stat-mini">
            <div style="width:40px;height:40px;border-radius:12px;background:#FEF3C7;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="18" height="18" fill="none" stroke="#D97706" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div>
              <div style="font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;">Pending</div>
              <div style="font-size:26px;font-weight:800;color:#111827;" id="stat-pending">0</div>
            </div>
          </div>
          <div class="stat-mini">
            <div style="width:40px;height:40px;border-radius:12px;background:#D1FAE5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="18" height="18" fill="none" stroke="#059669" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div>
              <div style="font-size:11px;color:#6B7280;font-weight:600;text-transform:uppercase;">Completed</div>
              <div style="font-size:26px;font-weight:800;color:#111827;" id="stat-done">0</div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
          <button class="filter-btn active" onclick="filterTasks('All',this)">All</button>
          <button class="filter-btn" onclick="filterTasks('Pending',this)">⏳ Pending</button>
          <button class="filter-btn" onclick="filterTasks('Completed',this)">✅ Completed</button>
          <button class="filter-btn" onclick="filterTasks('High',this)">🔴 High Priority</button>
        </div>

        <!-- Task List -->
        <div id="taskList"></div>

      </div>
    </div>
  </div>
  <div style="position: fixed; bottom: 20px; right: 30px; z-index: 9999; color: #7c3aed; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;">
    Powered By VIPPROW
</div>

  <script>
    injectCommonStyles();
    renderSidebar('Tasks');

    const token = localStorage.getItem('token');
    const user  = JSON.parse(localStorage.getItem('user') || '{}');
    const isAdmin = user.role === 'admin';
    if (!token) window.location.href = 'login.html';

    document.getElementById('headerContainer').innerHTML = renderHeader('Tasks',
      isAdmin ? `<button onclick="openModal()" style="background:#6C3EF4;color:white;border:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;">+ New Task</button>` : ''
    );

    if(isAdmin) document.getElementById('addTaskBtn').style.display = 'block';
    if(!isAdmin) document.getElementById('taskSubtitle').textContent = 'Tasks assigned to you by admin';

    const avColors = ['#6C3EF4','#EC4899','#0EA5E9','#10B981','#F59E0B','#EF4444'];
    function getInitials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
    function getColor(n){return avColors[(n||'A').charCodeAt(0)%avColors.length];}

    // ── Storage key per company ──
    const companyKey = `lp_tasks_${user.company_id || 'default'}`;
    let tasks = JSON.parse(localStorage.getItem(companyKey) || '[]');
    let allUsers = [], allLeads = [];
    let currentFilter = 'All';

    function saveTasks(){ localStorage.setItem(companyKey, JSON.stringify(tasks)); }

    // ── Load Dropdowns ──
    async function loadDropdowns(){
      try{
        const ru = await fetch('https://api.leadspro.tech/api/auth/users',{headers:{'Authorization':`Bearer ${token}`}});
        const du = await ru.json();
        if(du.success && du.data){
          allUsers = du.data;
          const sel = document.getElementById('t_user');
          du.data.forEach(u=>{
            const o = document.createElement('option');
            o.value = u.id;
            o.textContent = `${u.name} (${u.role||'user'})`;
            sel.appendChild(o);
          });
        }
      }catch(e){}
      try{
        const rl = await fetch('https://api.leadspro.tech/api/leads?limit=100',{headers:{'Authorization':`Bearer ${token}`}});
        const dl = await rl.json();
        if(dl.success && dl.data){
          allLeads = dl.data;
          const sel = document.getElementById('t_lead');
          dl.data.forEach(l=>{
            const o = document.createElement('option');
            o.value = l.id;
            o.textContent = `${l.name} — ${l.phone||''}`;
            sel.appendChild(o);
          });
        }
      }catch(e){}
    }

    // ── Modal ──
    function openModal(){
      document.getElementById('t_title').value='';
      document.getElementById('t_desc').value='';
      document.getElementById('t_user').value='';
      document.getElementById('t_lead').value='';
      document.getElementById('t_priority').value='Medium';
      document.getElementById('t_due').value='';
      document.getElementById('addModal').style.display='flex';
    }
    function closeModal(){ document.getElementById('addModal').style.display='none'; }
    document.getElementById('addModal').addEventListener('click',function(e){if(e.target===this)closeModal();});

    // ── Save Task ──
    function saveTask(){
      const title    = document.getElementById('t_title').value.trim();
      const desc     = document.getElementById('t_desc').value.trim();
      const userId   = document.getElementById('t_user').value;
      const leadId   = document.getElementById('t_lead').value;
      const priority = document.getElementById('t_priority').value;
      const due      = document.getElementById('t_due').value;

      if(!title){ showToast('⚠️ Task title required!','err'); return; }
      if(!userId){ showToast('⚠️ Please assign to a user!','err'); return; }
      if(!due){ showToast('⚠️ Due date required!','err'); return; }

      const userName = allUsers.find(u=>String(u.id)===String(userId))?.name || 'Unknown';
      const leadName = allLeads.find(l=>String(l.id)===String(leadId))?.name || null;

      tasks.unshift({
        id: Date.now(),
        title, desc, userId, userName,
        leadId: leadId||null, leadName,
        priority, due,
        status: 'Pending',
        completedAt: null,
        createdBy: user.name || 'Admin',
        createdAt: new Date().toISOString()
      });
      saveTasks(); updateStats(); renderTasks();
      closeModal();
      showToast('✅ Task created and assigned!','ok');
    }

    // ── Mark Done (User action) ──
    function markDone(id){
      const t = tasks.find(t=>t.id===id);
      if(!t || t.status==='Completed') return;
      t.status = 'Completed';
      t.completedAt = new Date().toISOString();
      saveTasks(); updateStats(); renderTasks();
      showToast('✅ Task marked as completed!','ok');
    }

    // ── Delete (Admin only) ──
    function deleteTask(id){
      if(!confirm('Delete this task?')) return;
      tasks = tasks.filter(t=>t.id!==id);
      saveTasks(); updateStats(); renderTasks();
      showToast('🗑️ Task deleted','ok');
    }

    // ── Filter ──
    function filterTasks(f, btn){
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    // ── Stats ──
    function updateStats(){
      const myTasks = isAdmin ? tasks : tasks.filter(t=>String(t.userId)===String(user.id));
      document.getElementById('stat-total').textContent   = myTasks.length;
      document.getElementById('stat-pending').textContent = myTasks.filter(t=>t.status==='Pending').length;
      document.getElementById('stat-done').textContent    = myTasks.filter(t=>t.status==='Completed').length;
    }

    // ── Render ──
    function renderTasks(){
      // Admin sees all tasks, users see only their own
      let visible = isAdmin ? tasks : tasks.filter(t=>String(t.userId)===String(user.id));

      if(currentFilter==='High') visible = visible.filter(t=>t.priority==='High');
      else if(currentFilter==='Pending') visible = visible.filter(t=>t.status==='Pending');
      else if(currentFilter==='Completed') visible = visible.filter(t=>t.status==='Completed');

      const list = document.getElementById('taskList');

      if(visible.length===0){
        list.innerHTML=`<div class="empty-state">
          <svg width="48" height="48" fill="none" stroke="#D1D5DB" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 16px;display:block;"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <p style="font-size:15px;font-weight:600;color:#374151;">No tasks found</p>
          <p style="font-size:13px;margin-top:6px;">${isAdmin?'Click "+ New Task" to create one':'No tasks assigned to you yet'}</p>
        </div>`;
        return;
      }

      const priorityColor = {High:'#EF4444', Medium:'#F59E0B', Low:'#10B981'};

      list.innerHTML = visible.map(t=>{
        const isOverdue = t.status!=='Completed' && new Date(t.due) < new Date();
        const dueFmt = new Date(t.due).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
        const completedFmt = t.completedAt ? new Date(t.completedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : null;

        return `
        <div class="task-card priority-${t.priority} ${t.status==='Completed'?'done-card':''}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
            <div style="flex:1;">

              <!-- Title + Badges -->
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
                <span style="font-size:14px;font-weight:700;color:#111827;${t.status==='Completed'?'text-decoration:line-through;color:#9CA3AF;':''}">${t.title}</span>
                <span class="badge priority-badge-${t.priority}" style="font-size:10px;padding:2px 8px;border-radius:20px;">${t.priority}</span>
                ${t.status==='Completed'?'<span style="background:#D1FAE5;color:#065F46;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;">✅ Completed</span>':''}
                ${isOverdue?'<span style="background:#FEE2E2;color:#991B1B;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;">⚠️ Overdue</span>':''}
              </div>

              <!-- Description -->
              ${t.desc?`<p style="font-size:12px;color:#6B7280;margin-bottom:8px;line-height:1.5;">${t.desc}</p>`:''}

              <!-- Meta Row -->
              <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                <!-- Assigned To -->
                <div style="display:flex;align-items:center;gap:6px;">
                  <div class="avatar" style="width:24px;height:24px;font-size:9px;border-radius:6px;background:${getColor(t.userName)}">${getInitials(t.userName)}</div>
                  <span style="font-size:12px;color:#6B7280;font-weight:500;">${t.userName}</span>
                </div>

                <!-- Lead -->
                ${t.leadName?`<div style="display:flex;align-items:center;gap:5px;">
                  <svg width="11" height="11" fill="none" stroke="#9CA3AF" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                  <span style="font-size:12px;color:#6B7280;">${t.leadName}</span>
                </div>`:''}

                <!-- Due Date -->
                <div style="display:flex;align-items:center;gap:5px;margin-left:auto;">
                  <svg width="11" height="11" fill="none" stroke="${isOverdue?'#EF4444':'#9CA3AF'}" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <span style="font-size:12px;color:${isOverdue?'#EF4444':'#9CA3AF'};font-weight:${isOverdue?'600':'400'};">${dueFmt}</span>
                </div>
              </div>

              <!-- Completed Info -->
              ${completedFmt?`<div style="margin-top:8px;font-size:11px;color:#059669;font-weight:500;">✅ Completed on ${completedFmt}</div>`:''}

              <!-- Created By (Admin view) -->
              ${isAdmin?`<div style="margin-top:4px;font-size:11px;color:#9CA3AF;">Created by ${t.createdBy}</div>`:''}
            </div>

            <!-- Action Buttons -->
            <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
              ${!isAdmin && t.status!=='Completed' ? `
                <button class="done-btn" onclick="markDone(${t.id})">✅ Mark Done</button>
              ` : ''}
              ${!isAdmin && t.status==='Completed' ? `
                <button class="done-btn completed" disabled>✅ Done</button>
              ` : ''}
              ${isAdmin ? `
                <button class="delete-btn" onclick="deleteTask(${t.id})">🗑️ Delete</button>
              ` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // ── Init ──
    if(isAdmin) loadDropdowns();
    updateStats();
    renderTasks();
  </script>
</body>
</html>
