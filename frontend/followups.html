<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadsPro — Follow Ups</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="sidebar.js"></script>
  <style>
    .fu-card { background:white; border-radius:14px; box-shadow:0 1px 8px rgba(0,0,0,0.07); margin-bottom:12px; overflow:hidden; }
    .fu-timer { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid #F0F4FF; }
    .fu-timer-text { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; }
    .fu-body { padding:14px 16px; }
    .fu-name { font-size:16px; font-weight:800; color:#1a1a2e; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
    .fu-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    
    .fu-label { font-size:10px; color:#9CA3AF; font-weight:600; margin-bottom:2px; }
    .fu-value { font-size:13px; color:#4F46E5; font-weight:600; }
    .fu-status-bar { background:#F0F4FF; border-radius:8px; padding:8px 12px; display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
    .btn-call { width:34px; height:34px; border-radius:50%; background:#EEF2FF; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .btn-calendar { width:34px; height:34px; border-radius:50%; background:#EEF2FF; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .tab-btn { padding:8px 20px; border:none; background:transparent; font-size:13px; font-weight:600; color:#9CA3AF; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
    .tab-btn.active { color:#4F46E5; border-bottom-color:#4F46E5; }
    .filter-chip { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:1.5px solid #E5E7EB; background:white; color:#6B7280; transition:all 0.2s; white-space:nowrap; }
    .filter-chip.active { background:#4F46E5; color:white; border-color:#4F46E5; }
    .overdue { color:#EF4444 !important; }
    .upcoming { color:#10B981 !important; }
    .today-color { color:#F59E0B !important; }

    /* Bottom Nav */
    .bottom-nav { display:none; position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #E5E7EB; padding:8px 0 12px; z-index:100; }
    .bottom-nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600; color:#9CA3AF; cursor:pointer; text-decoration:none; }
    .bottom-nav-item.active { color:#4F46E5; }
    @media (max-width:768px) { .bottom-nav { display:flex; } .main-scroll { padding-bottom:80px !important; } }

    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
    .toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; transform:translateX(150%); transition:transform 0.3s; z-index:999; max-width:300px; }
    .toast.show { transform:translateX(0); }
    .toast.ok { background:#D1FAE5; color:#065F46; }
    .toast.err { background:#FEE2E2; color:#991B1B; }
    .toast.info { background:#DBEAFE; color:#1E40AF; }
    .inp { width: 100%; padding: 10px; border: 1.5px solid #E5E7EB; border-radius: 10px; outline: none; font-family: inherit; font-size: 13px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">
      <div id="headerContainer"></div>

      <div class="main-scroll">

        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;background:white;border:1.5px solid #E5E7EB;border-radius:10px;padding:9px 14px;flex:1;">
            <svg width="16" height="16" fill="none" stroke="#9CA3AF" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="Search name here..." id="searchInput" oninput="searchFollowUps(this.value)" style="outline:none;border:none;background:transparent;font-size:13px;width:100%;font-family:'Plus Jakarta Sans',sans-serif;"/>
          </div>
          <button onclick="openAddModal()" style="background:#4F46E5;color:white;border:none;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;">+ Add</button>
        </div>

        <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none;">
          <button class="filter-chip active" onclick="setFilter('agent', this)">Agent</button>
          <button class="filter-chip" onclick="setFilter('status', this)">Status</button>
          <button class="filter-chip" onclick="setFilter('sub-status', this)">Sub-status</button>
        </div>

        <div style="display:flex;border-bottom:1px solid #E5E7EB;margin-bottom:16px;background:white;border-radius:12px 12px 0 0;overflow:hidden;">
          <button class="tab-btn active" onclick="setTab('Pending', this)" id="tab_pending">Pending</button>
          <button class="tab-btn" onclick="setTab('Missed', this)" id="tab_missed">Missed</button>
          <button class="tab-btn" onclick="setTab('Planned', this)" id="tab_planned">Planned</button>
          <button class="tab-btn" onclick="setTab('Done', this)" id="tab_done">Done</button>
        </div>

        <div style="display:flex;gap:10px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;">
          <div style="background:white;border-radius:12px;padding:12px 16px;min-width:90px;box-shadow:0 1px 4px rgba(0,0,0,0.06);flex-shrink:0;text-align:center;">
            <div id="statPending" style="font-size:20px;font-weight:800;color:#F59E0B;">—</div>
            <div style="font-size:10px;color:#9CA3AF;font-weight:600;">Pending</div>
          </div>
          <div style="background:white;border-radius:12px;padding:12px 16px;min-width:90px;box-shadow:0 1px 4px rgba(0,0,0,0.06);flex-shrink:0;text-align:center;">
            <div id="statMissed" style="font-size:20px;font-weight:800;color:#EF4444;">—</div>
            <div style="font-size:10px;color:#9CA3AF;font-weight:600;">Missed</div>
          </div>
          <div style="background:white;border-radius:12px;padding:12px 16px;min-width:90px;box-shadow:0 1px 4px rgba(0,0,0,0.06);flex-shrink:0;text-align:center;">
            <div id="statDone" style="font-size:20px;font-weight:800;color:#10B981;">—</div>
            <div style="font-size:10px;color:#9CA3AF;font-weight:600;">Done</div>
          </div>
          <div style="background:white;border-radius:12px;padding:12px 16px;min-width:90px;box-shadow:0 1px 4px rgba(0,0,0,0.06);flex-shrink:0;text-align:center;">
            <div id="statTotal" style="font-size:20px;font-weight:800;color:#4F46E5;">—</div>
            <div style="font-size:10px;color:#9CA3AF;font-weight:600;">Total</div>
          </div>
        </div>

        <div id="followupsContainer">
          <div style="text-align:center;padding:40px;color:#9CA3AF;">Loading...</div>
        </div>

      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="leads.html" class="bottom-nav-item">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Leads
    </a>
    <a href="leads.html" onclick="return false;" class="bottom-nav-item">
      <div style="width:44px;height:44px;background:#4F46E5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 4px 12px rgba(79,70,229,0.4);">
        <svg width="22" height="22" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      Create
    </a>
    <a href="followups.html" class="bottom-nav-item active">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6z"/></svg>
      FollowUp
    </a>
    <a href="settings.html" class="bottom-nav-item">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      Menu
    </a>
  </nav>

  <div id="modal" class="modal-bg" style="display:none;">
    <div style="background:white;border-radius:20px;width:100%;max-width:440px;overflow:hidden;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #F3F4F6;position:sticky;top:0;background:white;">
        <h3 style="font-weight:800;color:#111827;font-size:17px;">📅 Add Follow Up</h3>
        <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:20px;">✕</button>
      </div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:14px;">
        <div>
          <label style="font-size:11px;font-weight:600;color:#6B7280;display:block;margin-bottom:5px;"> SELECT LEAD  *</label>
          <select id="fu_lead" class="inp">
            <option value="">-- Choose Lead --</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;color:#6B7280;display:block;margin-bottom:5px;">FOLLOW UP DATE *</label>
          <input type="date" id="fu_date" class="inp"/>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;color:#6B7280;display:block;margin-bottom:5px;">FOLLOW UP TIME</label>
          <input type="time" id="fu_time" class="inp"/>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;color:#6B7280;display:block;margin-bottom:5px;">TYPE</label>
          <select id="fu_type" class="inp">
            <option value="Call">📞 Call</option>
            <option value="WhatsApp">💬 WhatsApp</option>
            <option value="SMS">📱 SMS</option>
            <option value="Email">📧 Email</option>
            <option value="Meeting">🤝 Meeting</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;color:#6B7280;display:block;margin-bottom:5px;">NOTES / REASON</label>
          <textarea id="fu_notes" class="inp" rows="2" placeholder="Follow up reason..."></textarea>
        </div>
      </div>
      <div style="padding:0 20px 20px;display:flex;gap:10px;">
        <button onclick="closeModal()" style="flex:1;border:1.5px solid #E5E7EB;background:white;color:#374151;font-weight:600;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;">Cancel</button>
        <button onclick="saveFollowUp()" style="flex:1;background:#4F46E5;color:white;font-weight:700;font-size:14px;padding:11px;border-radius:10px;border:none;cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <script>
    injectCommonStyles();
    renderSidebar('Follow Ups');
    document.getElementById('headerContainer').innerHTML = renderHeader('Follow Up',
      `<button onclick="openAddModal()" style="background:#4F46E5;color:white;border:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;">+ Add</button>`
    );

    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    let currentTab = 'Pending';
    let allFollowUps = [];
    let searchQuery = '';
    let timerInterval = null;

    // Show Toast Notification
    function showToast(msg, type='info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show ${type}`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ===== OPEN ADD MODAL (Loads dynamic leads inside dropdown) =====
    async function openAddModal() {
      try {
        const res = await fetch('/api/leads?limit=100', { headers:{ 'Authorization':`Bearer ${token}` } });
        const data = await res.json();
        if (data.success && data.data) {
          const sel = document.getElementById('fu_lead');
          sel.innerHTML = '<option value="">-- Select Lead  --</option>' +
            data.data.map(l => `<option value="${l.id}">#${l.id} — ${l.name} (${l.phone})</option>`).join('');
        }
      } catch(e) {
        console.error("Dropdown loading failed:", e);
      }
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display='none'; }

    // ===== COUNTDOWN TIMER =====
    function getCountdown(dateStr, timeStr) {
      const now = new Date();
      const fuDate = new Date(dateStr);
      if (timeStr) {
        const [h, m] = timeStr.split(':');
        fuDate.setHours(parseInt(h), parseInt(m), 0);
      } else {
        fuDate.setHours(9, 0, 0);
      }

      const diff = fuDate - now;
      const isPast = diff < 0;
      const absDiff = Math.abs(diff);

      const days    = Math.floor(absDiff / (1000*60*60*24));
      const hours   = Math.floor((absDiff % (1000*60*60*24)) / (1000*60*60));
      const minutes = Math.floor((absDiff % (1000*60*60)) / (1000*60));
      const seconds = Math.floor((absDiff % (1000*60)) / 1000);

      return {
        isPast,
        text: `${String(days).padStart(2,'0')}d : ${String(hours).padStart(2,'0')}h : ${String(minutes).padStart(2,'0')}m : ${String(seconds).padStart(2,'0')}s`,
        label: isPast ? 'Overdue' : (days === 0 ? 'Today' : 'Upcoming')
      };
    }

    function updateTimers() {
      document.querySelectorAll('[data-timer]').forEach(el => {
        const dateStr = el.getAttribute('data-date');
        const timeStr = el.getAttribute('data-time') || '';
        const { text, isPast, label } = getCountdown(dateStr, timeStr);
        el.textContent = (isPast ? '⏰ ' : '🕐 ') + text;
        el.className = `fu-timer-text ${isPast ? 'overdue' : label === 'Today' ? 'today-color' : 'upcoming'}`;
      });
    }

    // ===== RENDER CARDS =====
    function renderCards(data) {
      const container = document.getElementById('followupsContainer');

      if (!data.length) {
        container.innerHTML = `
          <div style="text-align:center;padding:60px 20px;">
            <div style="font-size:48px;margin-bottom:12px;">📭</div>
            <p style="color:#9CA3AF;font-weight:600;">No FollowUps</p>
            <button onclick="openAddModal()" style="margin-top:16px;background:#4F46E5;color:white;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">+ Add Follow Up</button>
          </div>`;
        return;
      }

      container.innerHTML = data.map(f => {
        const { text, isPast, label } = getCountdown(f.follow_up_date, f.follow_up_time || '');
        const timerColor = isPast ? '#EF4444' : (label === 'Today' ? '#F59E0B' : '#10B981');
        const scheduledDate = new Date(f.follow_up_date).toLocaleDateString('en-IN', {day:'2-digit',month:'2-digit',year:'numeric'});
        const scheduledTime = f.follow_up_time ? new Date(`2000-01-01T${f.follow_up_time}`).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase() : '09:00 AM';

        return `
          <div class="fu-card">
            <div class="fu-timer" style="background:${isPast?'#FFF5F5':label==='Today'?'#FFFBEB':'#F0FDF4'};">
              <span class="fu-timer-text ${isPast?'overdue':label==='Today'?'today-color':'upcoming'}" data-timer="true" data-date="${f.follow_up_date}" data-time="${f.follow_up_time||''}">
                ${isPast?'⏰':'🕐'} ${text}
              </span>
              <svg width="18" height="18" fill="none" stroke="${timerColor}" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </div>

            <div class="fu-body">
              <div class="fu-name">
                <span>${f.lead_name || 'Lead #'+f.lead_id}</span>
                <div style="display:flex;gap:8px;">
                  <button class="btn-call" onclick="window.location.href='tel:${f.lead_phone||''}'" title="Call">
                    <svg width="15" height="15" fill="none" stroke="#4F46E5" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6z"/></svg>
                  </button>
                  <button class="btn-calendar" onclick="reschedule(${f.id})" title="Reschedule">
                    <svg width="15" height="15" fill="none" stroke="#4F46E5" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  </button>
                </div>
              </div>

              <div class="fu-grid">
                <div class="fu-field">
                  <div class="fu-label">Type</div>
                  <div class="fu-value">${f.fu_type || 'Call'}</div>
                </div>
                <div class="fu-field">
                  <div class="fu-label">Scheduled At</div>
                  <div class="fu-value" style="color:#374151;">${scheduledDate}, ${scheduledTime}</div>
                </div>
                <div class="fu-field">
                  <div class="fu-label">Created By</div>
                  <div class="fu-value">${f.created_by_name || 'Admin'}</div>
                </div>
                <div class="fu-field">
                  <div class="fu-label">Reason</div>
                  <div class="fu-value" style="color:#374151;">${f.notes || '—'}</div>
                </div>
              </div>

              <div class="fu-status-bar">
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:13px;font-weight:600;color:#374151;">${f.lead_status || 'New'} - ${f.status}</span>
                  <svg width="13" height="13" fill="none" stroke="#9CA3AF" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </div>
                <div style="display:flex;gap:6px;">
                  ${f.status === 'Pending' ? `<button onclick="markDone(${f.id})" style="background:#D1FAE5;color:#065F46;border:none;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">✓ Done</button>` : ''}
                  <button onclick="deleteFollowUp(${f.id})" style="background:#FEE2E2;color:#EF4444;border:none;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">🗑</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimers, 1000);
    }

    // ===== LOAD DATA =====
    async function loadFollowUps() {
      try {
        const res  = await fetch('/api/followups', { headers:{ 'Authorization':`Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          allFollowUps = data.data;
          updateStats();
          filterAndRender();
        }
      } catch(e) {
        document.getElementById('followupsContainer').innerHTML = '<div style="text-align:center;padding:40px;color:#EF4444;">Server error</div>';
      }
    }

    function updateStats() {
      const todayStr = new Date().toISOString().split('T')[0];
      
      const pending = allFollowUps.filter(f => f.status === 'Pending' && f.follow_up_date >= todayStr);
      const missed  = allFollowUps.filter(f => f.status === 'Pending' && f.follow_up_date < todayStr);
      const done    = allFollowUps.filter(f => f.status === 'Done');
      
      document.getElementById('statPending').textContent = pending.length;
      document.getElementById('statMissed').textContent  = missed.length;
      document.getElementById('statDone').textContent    = done.length;
      document.getElementById('statTotal').textContent   = allFollowUps.length;
    }

    function filterAndRender() {
      const todayStr = new Date().toISOString().split('T')[0];
      let filtered = allFollowUps;

      // Tab filter (Strict string based date mapping)
      if (currentTab === 'Pending') {
        filtered = filtered.filter(f => f.status === 'Pending' && f.follow_up_date >= todayStr);
      } else if (currentTab === 'Missed') {
        filtered = filtered.filter(f => f.status === 'Pending' && f.follow_up_date < todayStr);
      } else if (currentTab === 'Planned') {
        filtered = filtered.filter(f => f.status === 'Pending' && f.follow_up_date > todayStr);
      } else if (currentTab === 'Done') {
        filtered = filtered.filter(f => f.status === 'Done');
      }

      // Search filter
      if (searchQuery) {
        filtered = filtered.filter(f =>
          (f.lead_name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
          (f.notes || '').toLowerCase().includes(searchQuery.toLowerCase())
        );
      }

      // Sort by date
      filtered.sort((a, b) => new Date(a.follow_up_date) - new Date(b.follow_up_date));

      renderCards(filtered);
    }

    function setTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterAndRender();
    }

    function setFilter(type, btn) {
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    let st;
    function searchFollowUps(v) {
      clearTimeout(st);
      st = setTimeout(() => { searchQuery = v; filterAndRender(); }, 300);
    }

    // ===== RESCHEDULE =====
    async function reschedule(id) {
      const newDate = prompt('Enter new date (YYYY-MM-DD):', new Date().toISOString().split('T')[0]);
      if (!newDate) return;
      try {
        const res  = await fetch(`/api/followups/${id}/reschedule`, {
          method: 'PUT',
          headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` },
          body: JSON.stringify({ follow_up_date: newDate })
        });
        const data = await res.json();
        if (data.success) { showToast('✅ Rescheduled!', 'ok'); loadFollowUps(); }
        else showToast('❌ ' + data.message, 'err');
      } catch(e) { showToast('❌ Server error', 'err'); }
    }

    // ===== MARK DONE =====
    async function markDone(id) {
      try {
        const res  = await fetch(`/api/followups/${id}/done`, { method:'PUT', headers:{ 'Authorization':`Bearer ${token}` } });
        const data = await res.json();
        if (data.success) { showToast('✅ Done!', 'ok'); loadFollowUps(); }
      } catch(e) { showToast('❌ Server error', 'err'); }
    }

    // ===== DELETE =====
    async function deleteFollowUp(id) {
      if (!confirm('Do you want to Delete?')) return;
      try {
        const res  = await fetch(`/api/followups/${id}`, { method:'DELETE', headers:{ 'Authorization':`Bearer ${token}` } });
        const data = await res.json();
        if (data.success) { showToast('✅ Deleted!', 'ok'); loadFollowUps(); }
      } catch(e) { showToast('❌ Server error', 'err'); }
    }

    // ===== SAVE FOLLOW UP =====
    async function saveFollowUp() {
      const lead_id        = document.getElementById('fu_lead').value;
      const follow_up_date = document.getElementById('fu_date').value;
      const follow_up_time = document.getElementById('fu_time').value;
      const fu_type        = document.getElementById('fu_type').value;
      const notes          = document.getElementById('fu_notes').value.trim();

      if (!lead_id || !follow_up_date) { showToast('⚠️ Lead ID and date required!', 'err'); return; }

      try {
        const res  = await fetch('/api/followups', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` },
          body: JSON.stringify({ lead_id, follow_up_date, follow_up_time, fu_type, notes })
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ Follow up added!', 'ok');
          closeModal();
          ['fu_lead','fu_date','fu_time','fu_notes'].forEach(id => document.getElementById(id).value='');
          loadFollowUps();
        } else showToast('❌ ' + data.message, 'err');
      } catch(e) { showToast('❌ Server error', 'err'); }
    }

    loadFollowUps();
  </script>
</body>
</html>
