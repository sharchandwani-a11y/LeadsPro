<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadsPro — Projects</title>
  <script src="config.js"></script>
  <link rel="icon" type="image/png" href="logosrbg.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="sidebar.js"></script>
  <style>
    .modal {
      position: fixed; inset: 0; z-index: 999;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1;
    }
    .modal-content {
      position: relative; z-index: 2; background: white;
      border-radius: 16px; width: 100%; max-width: 500px;
      margin: 0 auto; max-height: 90vh; overflow-y: auto;
    }
    .status-badge {
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .task-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: #F9FAFB; border-radius: 8px; margin-bottom: 6px;
    }
    .task-item.done span { text-decoration: line-through; color: #9CA3AF; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
 
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <div id="headerContainer"></div>
      <div class="main-scroll">
 
        <!-- Welcome Bar -->
        <div style="background:linear-gradient(135deg,#ede9fe,#fce7f3);border-radius:16px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
          <div>
            <h1 style="font-size:20px;font-weight:800;color:#1e1b4b;">Manage Projects </h1>
            <p style="color:#6B7280;font-size:13px;margin-top:3px;">Track all your client projects, tasks, and progress in one place.</p>
          </div>
          <button onclick="openAddModal()" style="background:#6C3EF4;color:white;border:none;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(108,62,244,0.35);">+ Add Project</button>
        </div>
 
        <!-- Stat Cards -->
        <div id="statsGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
 
          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#EDE9FE;display:flex;align-items:center;justify-content:center;">
                <svg width="19" height="19" fill="none" stroke="#7C3AED" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Total</span>
            </div>
            <div id="statTotal" style="font-size:32px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#EDE9FE;color:#7C3AED;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">All Projects</span></div>
          </div>
 
          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#DBEAFE;display:flex;align-items:center;justify-content:center;">
                <svg width="19" height="19" fill="none" stroke="#2563EB" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Active</span>
            </div>
            <div id="statActive" style="font-size:32px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#DBEAFE;color:#1E40AF;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">In Progress</span></div>
          </div>
 
          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#D1FAE5;display:flex;align-items:center;justify-content:center;">
                <svg width="19" height="19" fill="none" stroke="#10B981" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Completed</span>
            </div>
            <div id="statCompleted" style="font-size:32px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#D1FAE5;color:#065F46;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">Done</span></div>
          </div>
 
          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#FEF3C7;display:flex;align-items:center;justify-content:center;">
                <svg width="19" height="19" fill="none" stroke="#D97706" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Tasks Done</span>
            </div>
            <div id="statTasks" style="font-size:32px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">Checklist</span></div>
          </div>
 
        </div>
 
        <!-- Filter Bar -->
        <div style="background:white;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,0.06);margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;">
          <select id="statusFilter" onchange="loadProjects()" style="padding:10px 14px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:white;">
            <option value="">All Status</option>
            <option value="Planning">Planning</option>
            <option value="In Progress">In Progress</option>
            <option value="Review">Review</option>
            <option value="Completed">Completed</option>
            <option value="On Hold">On Hold</option>
          </select>
        </div>
 
        <!-- Projects Grid -->
        <div id="projectsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;"></div>
        <div id="pagination" style="padding:14px 0;display:flex;justify-content:center;gap:10px;align-items:center;margin-top:10px;"></div>
 
      </div>
    </div>
  </div>
 
  <!-- Add/Edit Project Modal -->
  <div id="projectModal" class="modal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
      <div style="padding:20px;border-bottom:1px solid #F3F4F6;">
        <h2 id="modalTitle" style="font-weight:700;color:#111827;font-size:16px;">Add New Project</h2>
      </div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:14px;">
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Project Name *</label>
          <input type="text" id="pName" class="inp" placeholder="e.g. Meta Ads Campaign Q3">
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Client</label>
          <select id="pClient" class="inp" style="background:white;">
            <option value="">Select Client</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Description</label>
          <textarea id="pDesc" class="inp" style="resize:vertical;min-height:70px;" placeholder="Project details..."></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Status</label>
            <select id="pStatus" class="inp" style="background:white;">
              <option value="Planning">Planning</option>
              <option value="In Progress">In Progress</option>
              <option value="Review">Review</option>
              <option value="Completed">Completed</option>
              <option value="On Hold">On Hold</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Budget (₹)</label>
            <input type="number" id="pBudget" class="inp" placeholder="0">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Start Date</label>
            <input type="date" id="pStart" class="inp">
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">End Date</label>
            <input type="date" id="pEnd" class="inp">
          </div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">
          <button onclick="closeModal()" style="background:#F3F4F6;color:#374151;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Cancel</button>
          <button onclick="submitProject()" style="background:#6C3EF4;color:white;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Save Project</button>
        </div>
      </div>
    </div>
  </div>
 
  <!-- View Project Modal -->
  <div id="viewModal" class="modal">
    <div class="modal-overlay" onclick="closeViewModal()"></div>
    <div class="modal-content" style="max-width:600px;max-height:90vh;">
      <div style="padding:20px;border-bottom:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:10;">
        <h2 id="viewTitle" style="font-weight:700;color:#111827;font-size:16px;">Project Details</h2>
        <button onclick="closeViewModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6B7280;">&times;</button>
      </div>
      <div id="viewContent" style="padding:20px;"></div>
    </div>
  </div>
 
  <div style="position:fixed;bottom:20px;right:30px;z-index:60;color:#7c3aed;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;">
    Powered By <a href="https://vipprow.com/" target="_blank" rel="noopener noreferrer"><b>VIPPROW</b></a>
  </div>
 
  <script>
    injectCommonStyles();
    renderSidebar('Projects');
    document.getElementById('headerContainer').innerHTML = renderHeader('Projects',
      `<button onclick="openAddModal()" style="background:#6C3EF4;color:white;border:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,62,244,0.3);">+ Add Project</button>`
    );
 
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
 
    let currentProjectId = null;
 
    const statusColors = {
      'Planning':    { bg: '#EDE9FE', color: '#7C3AED' },
      'In Progress': { bg: '#DBEAFE', color: '#2563EB' },
      'Review':      { bg: '#FEF3C7', color: '#D97706' },
      'Completed':   { bg: '#D1FAE5', color: '#065F46' },
      'On Hold':     { bg: '#F3F4F6', color: '#6B7280' }
    };
 
    // ── Load Stats ──
    async function loadStats() {
      try {
        const res = await fetch(`${API}/api/projects/stats`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          document.getElementById('statTotal').textContent     = data.stats.total || 0;
          document.getElementById('statActive').textContent    = data.stats.active || 0;
          document.getElementById('statCompleted').textContent = data.stats.completed || 0;
          document.getElementById('statTasks').textContent     = `${data.stats.doneTasks || 0}/${data.stats.totalTasks || 0}`;
        }
      } catch (e) { console.error(e); }
    }
 
    // ── Load Clients for dropdown ──
    async function loadClients() {
      try {
        const res = await fetch(`${API}/api/clients?limit=100`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const sel = document.getElementById('pClient');
        if (data.success) {
          data.data.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            sel.appendChild(opt);
          });
        }
      } catch (e) { console.error(e); }
    }
 
    // ── Load Projects ──
    async function loadProjects(page = 1) {
      const status = document.getElementById('statusFilter').value;
      let url = `${API}/api/projects?page=${page}&limit=9`;
      if (status) url += `&status=${encodeURIComponent(status)}`;
 
      try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const grid = document.getElementById('projectsGrid');
 
        if (data.success && data.data.length > 0) {
          grid.innerHTML = data.data.map(p => {
            const sc = statusColors[p.status] || statusColors['On Hold'];
            const progress = p.total_tasks > 0 ? Math.round((p.done_tasks / p.total_tasks) * 100) : 0;
            return `
              <div style="background:white;border-radius:14px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,0.06);cursor:pointer;transition:box-shadow 0.2s;" onclick="viewProject(${p.id})" onmouseover="this.style.boxShadow='0 4px 20px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow='0 1px 6px rgba(0,0,0,0.06)'">
                <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;">
                  <h3 style="font-size:14px;font-weight:700;color:#111827;margin:0;flex:1;padding-right:10px;">${p.name}</h3>
                  <span class="status-badge" style="background:${sc.bg};color:${sc.color};white-space:nowrap;">${p.status}</span>
                </div>
                ${p.client_name ? `<p style="font-size:12px;color:#6C3EF4;font-weight:600;margin:0 0 8px 0;">👤 ${p.client_name}</p>` : ''}
                ${p.description ? `<p style="font-size:12px;color:#6B7280;margin:0 0 12px 0;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${p.description}</p>` : ''}
                ${p.total_tasks > 0 ? `
                  <div style="margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                      <span style="font-size:11px;color:#6B7280;font-weight:600;">Tasks Progress</span>
                      <span style="font-size:11px;color:#6B7280;font-weight:600;">${p.done_tasks}/${p.total_tasks}</span>
                    </div>
                    <div style="height:6px;background:#F3F4F6;border-radius:10px;overflow:hidden;">
                      <div style="height:100%;width:${progress}%;background:#6C3EF4;border-radius:10px;transition:width 0.3s;"></div>
                    </div>
                  </div>
                ` : ''}
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid #F9FAFB;">
                  <span style="font-size:12px;color:#6B7280;">${p.budget > 0 ? '₹' + Number(p.budget).toLocaleString('en-IN') : 'No budget set'}</span>
                  <div style="display:flex;gap:8px;">
                    <button onclick="event.stopPropagation();editProject(${p.id})" style="background:none;border:none;color:#6C3EF4;cursor:pointer;font-weight:600;font-size:12px;">Edit</button>
                    <button onclick="event.stopPropagation();deleteProject(${p.id})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-weight:600;font-size:12px;">Delete</button>
                  </div>
                </div>
              </div>
            `;
          }).join('');
 
          const totalPages = data.pagination?.pages || 1;
          let paginationHTML = '';
          if (totalPages > 1) {
            if (page > 1) paginationHTML += `<button onclick="loadProjects(${page - 1})" style="background:#F3F4F6;border:1px solid #E5E7EB;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;">← Prev</button>`;
            paginationHTML += `<span style="font-size:12px;color:#6B7280;">Page ${page} of ${totalPages}</span>`;
            if (page < totalPages) paginationHTML += `<button onclick="loadProjects(${page + 1})" style="background:#F3F4F6;border:1px solid #E5E7EB;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;">Next →</button>`;
          }
          document.getElementById('pagination').innerHTML = paginationHTML;
        } else {
          grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#9CA3AF;">
            <div style="font-size:40px;margin-bottom:12px;">📁</div>
            <p style="font-weight:600;">No projects found</p>
            <p style="font-size:13px;">Click "+ Add Project" to get started</p>
          </div>`;
          document.getElementById('pagination').innerHTML = '';
        }
      } catch (e) {
        document.getElementById('projectsGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#EF4444;">Error loading projects</div>';
      }
    }
 
    // ── View Project ──
    async function viewProject(id) {
      try {
        const res = await fetch(`${API}/api/projects/${id}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (!data.success) return;
        const p = data.data;
        currentProjectId = id;
        const sc = statusColors[p.status] || statusColors['On Hold'];
        const progress = p.tasks?.length > 0 ? Math.round((p.tasks.filter(t => t.status === 'done').length / p.tasks.length) * 100) : 0;
 
        document.getElementById('viewTitle').textContent = p.name;
        document.getElementById('viewContent').innerHTML = `
          <div style="margin-bottom:16px;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
              <span class="status-badge" style="background:${sc.bg};color:${sc.color};">${p.status}</span>
              ${p.client_name ? `<span class="status-badge" style="background:#EDE9FE;color:#7C3AED;">👤 ${p.client_name}</span>` : ''}
              ${p.budget > 0 ? `<span class="status-badge" style="background:#D1FAE5;color:#065F46;">₹${Number(p.budget).toLocaleString('en-IN')}</span>` : ''}
            </div>
            ${p.description ? `<p style="font-size:13px;color:#374151;background:#F9FAFB;padding:12px;border-radius:8px;">${p.description}</p>` : ''}
            ${(p.start_date || p.end_date) ? `
              <div style="display:flex;gap:16px;font-size:12px;color:#6B7280;margin-top:8px;">
                ${p.start_date ? `<span>📅 Start: ${new Date(p.start_date).toLocaleDateString('en-IN')}</span>` : ''}
                ${p.end_date ? `<span>🏁 End: ${new Date(p.end_date).toLocaleDateString('en-IN')}</span>` : ''}
              </div>
            ` : ''}
          </div>
 
          <!-- Tasks -->
          <div style="border-top:1px solid #E5E7EB;padding-top:16px;margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h4 style="font-size:13px;font-weight:700;color:#111827;margin:0;">✅ Tasks (${p.tasks?.length || 0})</h4>
              <span style="font-size:12px;color:#6B7280;">${progress}% done</span>
            </div>
            ${p.tasks?.length > 0 ? `
              <div style="height:6px;background:#F3F4F6;border-radius:10px;overflow:hidden;margin-bottom:12px;">
                <div style="height:100%;width:${progress}%;background:#6C3EF4;border-radius:10px;"></div>
              </div>
            ` : ''}
            <div id="tasksList">
              ${p.tasks?.length > 0 ? p.tasks.map(t => `
                <div class="task-item ${t.status === 'done' ? 'done' : ''}" id="task-${t.id}">
                  <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} onchange="toggleTask(${t.id})" style="cursor:pointer;width:16px;height:16px;accent-color:#6C3EF4;">
                  <span style="flex:1;font-size:13px;color:#374151;">${t.task_name}</span>
                  <button onclick="deleteTask(${t.id})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:12px;">🗑️</button>
                </div>
              `).join('') : '<p style="font-size:12px;color:#9CA3AF;">No tasks yet</p>'}
            </div>
            <div style="display:flex;gap:8px;margin-top:10px;">
              <input type="text" id="newTask" placeholder="Add a task..." style="flex:1;padding:8px 12px;border:1px solid #E5E7EB;border-radius:6px;font-size:12px;font-family:inherit;outline:none;">
              <button onclick="addTask(${id})" style="background:#6C3EF4;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;">Add</button>
            </div>
          </div>
 
          <div style="display:flex;gap:10px;border-top:1px solid #E5E7EB;padding-top:16px;">
            <button onclick="editProject(${id})" style="flex:1;background:#6C3EF4;color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;">Edit Project</button>
            <button onclick="deleteProject(${id})" style="flex:1;background:#FEE2E2;color:#DC2626;border:none;padding:10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;">Delete</button>
          </div>
        `;
        document.getElementById('viewModal').style.display = 'flex';
      } catch (e) { showToast('❌ Error loading project', 'err'); }
    }
 
    // ── Add Task ──
    async function addTask(projectId) {
      const taskName = document.getElementById('newTask').value.trim();
      if (!taskName) return;
      try {
        const res = await fetch(`${API}/api/projects/tasks/add`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ project_id: projectId, task_name: taskName })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('newTask').value = '';
          viewProject(projectId);
          loadStats();
          showToast('✅ Task added!', 'ok');
        }
      } catch (e) { showToast('❌ Error adding task', 'err'); }
    }
 
    // ── Toggle Task ──
    async function toggleTask(taskId) {
      try {
        await fetch(`${API}/api/projects/tasks/${taskId}/toggle`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        viewProject(currentProjectId);
        loadStats();
      } catch (e) { showToast('❌ Error updating task', 'err'); }
    }
 
    // ── Delete Task ──
    async function deleteTask(taskId) {
      try {
        await fetch(`${API}/api/projects/tasks/${taskId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        viewProject(currentProjectId);
        loadStats();
        showToast('✅ Task deleted!', 'ok');
      } catch (e) { showToast('❌ Error deleting task', 'err'); }
    }
 
    // ── Open Add Modal ──
    function openAddModal() {
      currentProjectId = null;
      document.getElementById('modalTitle').textContent = 'Add New Project';
      document.getElementById('pName').value = '';
      document.getElementById('pClient').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pStatus').value = 'Planning';
      document.getElementById('pBudget').value = '';
      document.getElementById('pStart').value = '';
      document.getElementById('pEnd').value = '';
      document.getElementById('projectModal').style.display = 'flex';
    }
 
    function closeModal() { document.getElementById('projectModal').style.display = 'none'; }
    function closeViewModal() { document.getElementById('viewModal').style.display = 'none'; }
 
    // ── Edit Project ──
    async function editProject(id) {
      try {
        const res = await fetch(`${API}/api/projects/${id}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          const p = data.data;
          currentProjectId = id;
          document.getElementById('modalTitle').textContent = 'Edit Project';
          document.getElementById('pName').value = p.name;
          document.getElementById('pClient').value = p.client_id || '';
          document.getElementById('pDesc').value = p.description || '';
          document.getElementById('pStatus').value = p.status;
          document.getElementById('pBudget').value = p.budget || '';
          document.getElementById('pStart').value = p.start_date ? p.start_date.split('T')[0] : '';
          document.getElementById('pEnd').value = p.end_date ? p.end_date.split('T')[0] : '';
          closeViewModal();
          document.getElementById('projectModal').style.display = 'flex';
        }
      } catch (e) { showToast('❌ Error loading project', 'err'); }
    }
 
    // ── Submit Project ──
    async function submitProject() {
      const name = document.getElementById('pName').value.trim();
      if (!name) { showToast('❌ Project name required', 'err'); return; }
 
      const body = {
        name,
        client_id: document.getElementById('pClient').value || null,
        description: document.getElementById('pDesc').value,
        status: document.getElementById('pStatus').value,
        budget: document.getElementById('pBudget').value || 0,
        start_date: document.getElementById('pStart').value || null,
        end_date: document.getElementById('pEnd').value || null
      };
 
      const method = currentProjectId ? 'PUT' : 'POST';
      const url = currentProjectId ? `${API}/api/projects/${currentProjectId}` : `${API}/api/projects`;
 
      try {
        const res = await fetch(url, {
          method,
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          showToast(currentProjectId ? '✅ Project updated!' : '✅ Project created!', 'ok');
          closeModal();
          loadProjects();
          loadStats();
        } else {
          showToast('❌ ' + (data.message || 'Error'), 'err');
        }
      } catch (e) { showToast('❌ Server error', 'err'); }
    }
 
    // ── Delete Project ──
    async function deleteProject(id) {
      if (confirm('Delete this project? All tasks will also be deleted.')) {
        try {
          const res = await fetch(`${API}/api/projects/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.success) {
            closeViewModal();
            loadProjects();
            loadStats();
            showToast('✅ Project deleted!', 'ok');
          }
        } catch (e) { showToast('❌ Error deleting project', 'err'); }
      }
    }
 
    // ── Responsive Grid ──
    function fixGrid() {
      const g = document.getElementById('statsGrid');
      if (window.innerWidth < 640) g.style.gridTemplateColumns = 'repeat(2,1fr)';
      else if (window.innerWidth < 1024) g.style.gridTemplateColumns = 'repeat(2,1fr)';
      else g.style.gridTemplateColumns = 'repeat(4,1fr)';
    }
    fixGrid();
    window.addEventListener('resize', fixGrid);
 
    // ── Init ──
    loadStats();
    loadClients();
    loadProjects();
  </script>
</body>
</html>
