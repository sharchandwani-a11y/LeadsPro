<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadsPro — Revenue</title>
  <script src="config.js"></script>
  <link rel="icon" type="image/png" href="logosrbg.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="sidebar.js"></script>
  <style>
    .modal {
      position: fixed; inset: 0; z-index: 999;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1;
    }
    .modal-content {
      position: relative; z-index: 2; background: white;
      border-radius: 16px; width: 100%; max-width: 480px;
      margin: 0 auto; max-height: 90vh; overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
 
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <div id="headerContainer"></div>
      <div class="main-scroll">
 
        <!-- Welcome Bar -->
        <div style="background:linear-gradient(135deg,#ede9fe,#fce7f3);border-radius:16px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
          <div>
            <h1 style="font-size:20px;font-weight:800;color:#1e1b4b;">Revenue Tracker 💰</h1>
            <p style="color:#6B7280;font-size:13px;margin-top:3px;">Track payments received and pending from your clients.</p>
          </div>
          <button onclick="openAddModal()" style="background:#6C3EF4;color:white;border:none;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(108,62,244,0.35);">+ Add Payment</button>
        </div>
 
        <!-- Stat Cards -->
        <div id="statsGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">
 
          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);transition:box-shadow 0.2s;" onmouseover="this.style.boxShadow='0 4px 16px rgba(108,62,244,0.12)'" onmouseout="this.style.boxShadow='0 1px 6px rgba(0,0,0,0.06)'">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#EDE9FE;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" fill="none" stroke="#7C3AED" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Total Revenue</span>
            </div>
            <div id="statTotal" style="font-size:28px;font-weight:800;color:#111827;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#EDE9FE;color:#7C3AED;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">All Payments</span></div>
          </div>
 
          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);transition:box-shadow 0.2s;" onmouseover="this.style.boxShadow='0 4px 16px rgba(16,185,129,0.12)'" onmouseout="this.style.boxShadow='0 1px 6px rgba(0,0,0,0.06)'">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#D1FAE5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" fill="none" stroke="#059669" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Received</span>
            </div>
            <div id="statReceived" style="font-size:28px;font-weight:800;color:#059669;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#D1FAE5;color:#065F46;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;"> Collected</span></div>
          </div>
 
          <div style="background:white;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,0.06);transition:box-shadow 0.2s;" onmouseover="this.style.boxShadow='0 4px 16px rgba(239,68,68,0.12)'" onmouseout="this.style.boxShadow='0 1px 6px rgba(0,0,0,0.06)'">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:#FEE2E2;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="19" height="19" fill="none" stroke="#EF4444" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </div>
              <span style="font-size:13px;color:#6B7280;font-weight:600;">Pending</span>
            </div>
            <div id="statPending" style="font-size:28px;font-weight:800;color:#EF4444;line-height:1;">—</div>
            <div style="margin-top:8px;"><span style="background:#FEE2E2;color:#DC2626;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;"> Due</span></div>
          </div>
 
        </div>
 
        <!-- Filter Bar -->
        <div style="background:white;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,0.06);margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
          <select id="statusFilter" onchange="loadPayments()" style="padding:10px 14px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:white;">
            <option value="">All Payments</option>
            <option value="received">Received</option>
            <option value="pending">Pending</option>
          </select>
          <div style="margin-left:auto;font-size:13px;color:#6B7280;font-weight:600;" id="paymentCount">0 entries</div>
        </div>
 
        <!-- Payments Table -->
        <div style="background:white;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);overflow:hidden;">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #F3F4F6;">
            <h2 style="font-weight:700;color:#111827;font-size:15px;"> Payment History</h2>
          </div>
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;min-width:600px;">
              <thead style="background:#F9FAFB;">
                <tr>
                  <th style="text-align:left;padding:10px 16px;font-size:11px;color:#6B7280;font-weight:600;">CLIENT</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;" class="hide-mobile">PROJECT</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;" class="hide-mobile">DESCRIPTION</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;">AMOUNT</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;">STATUS</th>
                  <th style="text-align:left;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;" class="hide-mobile">DATE</th>
                  <th style="text-align:center;padding:10px 12px;font-size:11px;color:#6B7280;font-weight:600;">ACTIONS</th>
                </tr>
              </thead>
              <tbody id="paymentsTableBody">
                <tr><td colspan="7" style="text-align:center;padding:30px;color:#9CA3AF;">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="pagination" style="padding:14px 16px;border-top:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center;"></div>
        </div>
 
      </div>
    </div>
  </div>
 
  <!-- Add/Edit Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
      <div style="padding:20px;border-bottom:1px solid #F3F4F6;">
        <h2 id="modalTitle" style="font-weight:700;color:#111827;font-size:16px;">Add Payment</h2>
      </div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:14px;">
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Client</label>
          <select id="rClient" class="inp" style="background:white;">
            <option value="">Select Client</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Project (Optional)</label>
          <select id="rProject" class="inp" style="background:white;">
            <option value="">Select Project</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Description</label>
          <input type="text" id="rDesc" class="inp" placeholder="e.g. First installment, Full payment...">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Amount (₹) *</label>
            <input type="number" id="rAmount" class="inp" placeholder="0">
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Status</label>
            <select id="rStatus" class="inp" style="background:white;">
              <option value="pending">Pending</option>
              <option value="received">Received</option>
            </select>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;">Payment Date</label>
          <input type="date" id="rDate" class="inp">
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">
          <button onclick="closeModal()" style="background:#F3F4F6;color:#374151;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Cancel</button>
          <button onclick="submitPayment()" style="background:#6C3EF4;color:white;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Save Payment</button>
        </div>
      </div>
    </div>
  </div>
 
  <div style="position:fixed;bottom:20px;right:30px;z-index:60;color:#7c3aed;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;">
    Powered By <a href="https://vipprow.com/" target="_blank" rel="noopener noreferrer"><b>VIPPROW</b></a>
  </div>
 
  <script>
    injectCommonStyles();
    renderSidebar('Revenue');
    document.getElementById('headerContainer').innerHTML = renderHeader('Revenue',
      `<button onclick="openAddModal()" style="background:#6C3EF4;color:white;border:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,62,244,0.3);">+ Add Payment</button>`
    );
 
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
 
    let currentPaymentId = null;
 
    function formatINR(n) {
      return '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 0 });
    }
 
    // ── Load Stats ──
    async function loadStats() {
      try {
        const res = await fetch(`${API}/api/revenue/stats`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          document.getElementById('statTotal').textContent    = formatINR(data.stats.total);
          document.getElementById('statReceived').textContent = formatINR(data.stats.received);
          document.getElementById('statPending').textContent  = formatINR(data.stats.pending);
        }
      } catch (e) { console.error(e); }
    }
 
    // ── Load Clients ──
    async function loadClients() {
      try {
        const res = await fetch(`${API}/api/clients?limit=100`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const sel = document.getElementById('rClient');
        if (data.success) {
          data.data.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id; opt.textContent = c.name;
            sel.appendChild(opt);
          });
        }
      } catch (e) { console.error(e); }
    }
 
    // ── Load Projects ──
    async function loadProjects() {
      try {
        const res = await fetch(`${API}/api/projects?limit=100`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const sel = document.getElementById('rProject');
        if (data.success) {
          data.data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id; opt.textContent = p.name;
            sel.appendChild(opt);
          });
        }
      } catch (e) { console.error(e); }
    }
 
    // ── Load Payments ──
    async function loadPayments(page = 1) {
      const status = document.getElementById('statusFilter').value;
      let url = `${API}/api/revenue?page=${page}&limit=10`;
      if (status) url += `&status=${status}`;
 
      try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const tbody = document.getElementById('paymentsTableBody');
 
        if (data.success && data.data.length > 0) {
          tbody.innerHTML = data.data.map(p => {
            const isReceived = p.payment_status === 'received';
            return `
              <tr style="border-bottom:1px solid #F9FAFB;">
                <td style="padding:12px 16px;">
                  <span style="font-size:13px;font-weight:600;color:#1F2937;">${p.client_name || '—'}</span>
                </td>
                <td style="padding:12px;font-size:13px;color:#6B7280;" class="hide-mobile">${p.project_name || '—'}</td>
                <td style="padding:12px;font-size:13px;color:#6B7280;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" class="hide-mobile">${p.description || '—'}</td>
                <td style="padding:12px;">
                  <span style="font-size:13px;font-weight:700;color:#111827;">${formatINR(p.amount)}</span>
                </td>
                <td style="padding:12px;">
                  <span style="padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:${isReceived ? '#D1FAE5' : '#FEF3C7'};color:${isReceived ? '#065F46' : '#92400E'};">
                    ${isReceived ? '✅ Received' : '⏳ Pending'}
                  </span>
                </td>
                <td style="padding:12px;font-size:12px;color:#6B7280;" class="hide-mobile">
                  ${p.payment_date ? new Date(p.payment_date).toLocaleDateString('en-IN') : '—'}
                </td>
                <td style="padding:12px;text-align:center;">
                  <button onclick="editPayment(${p.id})" style="background:none;border:none;color:#6C3EF4;cursor:pointer;font-weight:600;font-size:12px;">Edit</button>
                  ${!isReceived ? `<button onclick="markReceived(${p.id})" style="background:none;border:none;color:#059669;cursor:pointer;font-weight:600;font-size:12px;margin-left:6px;">✓ Mark</button>` : ''}
                  <button onclick="deletePayment(${p.id})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-weight:600;font-size:12px;margin-left:6px;">Delete</button>
                </td>
              </tr>
            `;
          }).join('');
 
          const total = data.pagination?.total || 0;
          const totalPages = data.pagination?.pages || 1;
          document.getElementById('paymentCount').textContent = `${total} entries`;
 
          let paginationHTML = '';
          if (totalPages > 1) {
            if (page > 1) paginationHTML += `<button onclick="loadPayments(${page-1})" style="background:#F3F4F6;border:1px solid #E5E7EB;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">← Prev</button>`;
            paginationHTML += `<span style="font-size:12px;color:#6B7280;">Page ${page} of ${totalPages}</span>`;
            if (page < totalPages) paginationHTML += `<button onclick="loadPayments(${page+1})" style="background:#F3F4F6;border:1px solid #E5E7EB;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">Next →</button>`;
          }
          document.getElementById('pagination').innerHTML = paginationHTML;
        } else {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#9CA3AF;">No payments found</td></tr>';
          document.getElementById('pagination').innerHTML = '';
          document.getElementById('paymentCount').textContent = '0 entries';
        }
      } catch (e) {
        document.getElementById('paymentsTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#EF4444;">Error loading payments</td></tr>';
      }
    }
 
    // ── Open Add Modal ──
    function openAddModal() {
      currentPaymentId = null;
      document.getElementById('modalTitle').textContent = 'Add Payment';
      document.getElementById('rClient').value = '';
      document.getElementById('rProject').value = '';
      document.getElementById('rDesc').value = '';
      document.getElementById('rAmount').value = '';
      document.getElementById('rStatus').value = 'pending';
      document.getElementById('rDate').value = '';
      document.getElementById('paymentModal').style.display = 'flex';
    }
 
    function closeModal() {
      document.getElementById('paymentModal').style.display = 'none';
      currentPaymentId = null;
    }
 
    // ── Submit Payment ──
    async function submitPayment() {
      const amount = document.getElementById('rAmount').value;
      if (!amount) { showToast('❌ Amount required', 'err'); return; }
 
      const body = {
        client_id: document.getElementById('rClient').value || null,
        project_id: document.getElementById('rProject').value || null,
        description: document.getElementById('rDesc').value,
        amount,
        payment_status: document.getElementById('rStatus').value,
        payment_date: document.getElementById('rDate').value || null
      };
 
      const method = currentPaymentId ? 'PUT' : 'POST';
      const url = currentPaymentId ? `${API}/api/revenue/${currentPaymentId}` : `${API}/api/revenue`;
 
      try {
        const res = await fetch(url, {
          method,
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          showToast(currentPaymentId ? '✅ Payment updated!' : '✅ Payment added!', 'ok');
          closeModal();
          loadPayments();
          loadStats();
        } else {
          showToast('❌ ' + (data.message || 'Error'), 'err');
        }
      } catch (e) { showToast('❌ Server error', 'err'); }
    }
 
    // ── Edit Payment ──
    async function editPayment(id) {
      try {
        const res = await fetch(`${API}/api/revenue?page=1&limit=1000`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const p = data.data?.find(x => x.id === id);
        if (!p) return;
        currentPaymentId = id;
        document.getElementById('modalTitle').textContent = 'Edit Payment';
        document.getElementById('rClient').value  = p.client_id || '';
        document.getElementById('rProject').value = p.project_id || '';
        document.getElementById('rDesc').value    = p.description || '';
        document.getElementById('rAmount').value  = p.amount;
        document.getElementById('rStatus').value  = p.payment_status;
        document.getElementById('rDate').value    = p.payment_date ? p.payment_date.split('T')[0] : '';
        document.getElementById('paymentModal').style.display = 'flex';
      } catch (e) { showToast('❌ Error loading payment', 'err'); }
    }
 
    // ── Mark as Received ──
    async function markReceived(id) {
      try {
        const res = await fetch(`${API}/api/revenue/${id}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ payment_status: 'received', payment_date: new Date().toISOString().split('T')[0] })
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ Marked as received!', 'ok');
          loadPayments();
          loadStats();
        }
      } catch (e) { showToast('❌ Error', 'err'); }
    }
 
    // ── Delete Payment ──
    async function deletePayment(id) {
      if (confirm('Delete this payment entry?')) {
        try {
          const res = await fetch(`${API}/api/revenue/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.success) {
            loadPayments();
            loadStats();
            showToast('✅ Payment deleted!', 'ok');
          }
        } catch (e) { showToast('❌ Error deleting payment', 'err'); }
      }
    }
 
    // ── Responsive Grid ──
    function fixGrid() {
      const g = document.getElementById('statsGrid');
      if (window.innerWidth < 640) g.style.gridTemplateColumns = '1fr';
      else g.style.gridTemplateColumns = 'repeat(3,1fr)';
    }
    fixGrid();
    window.addEventListener('resize', fixGrid);
 
    // ── Init ──
    loadStats();
    loadClients();
    loadProjects();
    loadPayments();
  </script>
</body>
</html>
