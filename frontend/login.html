<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadsPro — Login</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;}
    body{background:#0f0a1e;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.3;animation:float 8s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}
    .card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;width:100%;max-width:420px;padding:32px;margin:16px;}
    .inp{background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:white;width:100%;padding:12px 16px 12px 42px;font-size:14px;outline:none;transition:all 0.2s;}
    .inp:focus{border-color:#6C3EF4;background:rgba(108,62,244,0.1);}
    .inp::placeholder{color:rgba(255,255,255,0.3);}
    .btn{background:linear-gradient(135deg,#6C3EF4,#4F46E5);border-radius:10px;padding:14px;color:white;font-weight:700;width:100%;font-size:14px;border:none;cursor:pointer;transition:all 0.2s;box-shadow:0 8px 24px rgba(108,62,244,0.4);}
    .btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(108,62,244,0.5);}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .shake{animation:shake 0.3s ease;}
    .toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;transform:translateX(150%);transition:transform 0.3s;z-index:999;}
    .toast.show{transform:translateX(0);}
    .toast.err{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#FCA5A5;}
    .toast.ok{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#6EE7B7;}
    label{color:rgba(255,255,255,0.5);font-size:12px;font-weight:600;display:block;margin-bottom:8px;}
  </style>
</head>
<body>
  <div class="blob" style="width:400px;height:400px;background:#6C3EF4;top:-100px;left:-100px;"></div>
  <div class="blob" style="width:300px;height:300px;background:#EC4899;bottom:-80px;right:-80px;animation-delay:3s;"></div>
  <div id="toast" class="toast"></div>

  <div class="card">
    <div style="text-align:center;margin-bottom:28px;">
      <!-- <img src="logo.jpeg" style="width:64px;height:64px;border-radius:16px;object-fit:cover;margin:0 auto 14px;display:block;background:#1a0e40;padding:6px;" onerror="this.style.display='none'"/> -->
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;">
  <img src="sneha.png" style="width:150px;height:120px;border-radius:10px;object-fit:cover;"/>
  <!-- <h1 style="color:white;font-size:24px;font-weight:800;">LeadsPro CRM</h1> -->
</div>
      <p style="color:rgba(255,255,255,0.4);font-size:14px;margin-top:4px;">Login into your account</p>
    </div>

    
    <div style="margin-bottom:16px;">
      <label>EMAIL</label>
      <div style="position:relative;">
        <svg style="position:absolute;left:13px;top:50%;transform:translateY(-50%);" width="16" height="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="email" class="inp" placeholder="admin@leadspro.com"/>
      </div>
    </div>

    <div style="margin-bottom:24px;">
      <label>PASSWORD</label>
      <div style="position:relative;">
        <svg style="position:absolute;left:13px;top:50%;transform:translateY(-50%);" width="16" height="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" class="inp" placeholder="••••••••"/>
      </div>
    </div>

    <button class="btn" onclick="handleLogin()">Login →</button>
    <p style="text-align:center;color:rgba(255,255,255,0.3);font-size:12px;margin-top:20px;">
      New account? <a href="signup.html" style="color:#A78BFA;font-weight:600;">Sign Up!</a>
    </p>
  </div>

  <script>
    function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.classList.remove('show'),3000);}
    async function handleLogin(){
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      if(!email||!password){document.querySelector('.card').classList.add('shake');setTimeout(()=>document.querySelector('.card').classList.remove('shake'),300);showToast('⚠️ Enter Email and Password!','err');return;}
      try{
        const res=await fetch('https://api.leadspro.tech/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
        const data=await res.json();
        if(data.success){localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));showToast('✅ Login successful!','ok');setTimeout(()=>window.location.href='dashboard.html',1000);}
        else{document.querySelector('.card').classList.add('shake');setTimeout(()=>document.querySelector('.card').classList.remove('shake'),300);showToast('❌ '+data.message,'err');}
      }catch(e){showToast('❌ Not connected with the Server','err');}
    }
    document.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
  </script>
</body>
</html>
